name: Schedule newsletter broadcasts

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (log only, do not call the Kit API)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  schedule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Schedule drafts with Kit
        env:
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: node newsletter/scripts/schedule-broadcasts.mjs

      - name: Commit updated draft status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add newsletter/drafts
          git diff --cached --quiet || git commit -m "chore: update newsletter draft status"
          git push
