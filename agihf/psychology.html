<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AGHF Agent — A Girl & Her Futures</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,700;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/tokens.css">
<link rel="stylesheet" href="shared/sidebar.css">
<link rel="stylesheet" href="shared/components.css">
<link rel="stylesheet" href="shared/dayli-desk.css">
<link rel="stylesheet" href="shared/agent.css">
</head>
<body>

<script src="shared/auth-guard.js"></script>
<script src="shared/sidebar.js" data-active="agent"></script>

<main class="main" style="padding:12px;">
  <div id="agcRoot"></div>
</main>

<script type="module">
  import { renderAgentWorkspace } from './shared/agent-engine.js';

  function renderLoadError(container, err) {
    console.error('AGHF Agent failed to load:', err);
    container.innerHTML = `
      <div style="max-width:520px;margin:60px auto;padding:28px;background:#fff;border-radius:16px;border:1px solid var(--border,#F1E7E1);text-align:center;">
        <div style="font-size:1.1rem;font-weight:700;color:var(--text,#3D2B20);margin-bottom:8px;">Something went wrong loading the AGHF Agent</div>
        <div style="font-size:.88rem;color:var(--muted,#7A5C50);margin-bottom:18px;word-break:break-word;">${(err && err.message) ? err.message : 'An unexpected error occurred.'}</div>
        <button type="button" onclick="location.reload()" style="padding:10px 22px;border-radius:999px;border:none;background:var(--pink,#F4829A);color:#fff;font-weight:600;cursor:pointer;">Reload</button>
      </div>`;
  }

  function boot() {
    const root = document.getElementById('agcRoot');
    try {
      renderAgentWorkspace(root, {});
    } catch (err) {
      renderLoadError(root, err);
    }
  }

  document.addEventListener('aghf-auth-ready', boot);
</script>

</body>
</html>
