<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pass Your Eval Calculator — A Girl & Her Futures</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,700;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/tokens.css">
<link rel="stylesheet" href="shared/sidebar.css">
<link rel="stylesheet" href="shared/components.css">
<link rel="stylesheet" href="shared/dayli-desk.css">
</head>
<body>

<script src="shared/auth-guard.js"></script>
<script src="shared/sidebar.js" data-active="eval-calculator"></script>

<main class="main">
  <div class="pg-eye">✦ Planning Tool</div>
  <div class="pg-title">Pass Your Eval Calculator</div>
  <div class="small-help" style="margin:-8px 0 18px;max-width:640px;">Educational planning tool only — not financial advice, not a guarantee of results, a pass date, or profit. Your actual results will vary.</div>

  <div id="evalPlanBar" style="margin-bottom:14px;"></div>
  <div id="evalRoot"></div>
</main>

<script type="module">
  // Dynamic imports, wrapped in try/catch — a failure in any one of these
  // (bad path, stale deployment, a syntax error anywhere in their import
  // graph) shows a visible error instead of leaving #evalRoot permanently
  // empty, matching every other page in this project.
  let listEvalPlans, getEvalPlan, saveEvalPlan, duplicateEvalPlan, archiveEvalPlan, setActiveEvalPlan, deleteEvalPlan, syncEvalPlanProgress;
  let renderEvalCalculatorPage;
  let renderErrorState, renderSkeleton, showDeskToast;
  let validatePlanInputs;

  const root = document.getElementById('evalRoot');
  const planBar = document.getElementById('evalPlanBar');

  function renderFallbackError(err) {
    console.error('Eval calculator page failed to load:', err);
    root.innerHTML = `
      <div style="max-width:520px;margin:40px auto;padding:28px;background:#fff;border-radius:16px;border:1px solid #F1E7E1;text-align:center;">
        <div style="font-size:1.1rem;font-weight:700;color:#3D2B20;margin-bottom:8px;">Something went wrong loading the Eval Calculator</div>
        <div style="font-size:.88rem;color:#7A5C50;margin-bottom:18px;word-break:break-word;">${(err && err.message) ? err.message : 'An unexpected error occurred.'}</div>
        <button type="button" onclick="location.reload()" style="padding:10px 22px;border-radius:999px;border:none;background:#F4829A;color:#fff;font-weight:600;cursor:pointer;">Reload</button>
      </div>`;
  }

  function freshPlan() {
    return {
      name: 'New Eval Plan', status: 'draft', isActive: false,
      accountSize: 50000, isCustomAccount: false, startingBalance: 50000,
      profitTargetType: 'fixed_amount', drawdownType: 'static', riskMode: 'points',
      stopAfterWin: false, reduceSizeAfterLoss: false, tradingDaysElapsed: 0,
    };
  }

  /** A brand-new blank plan carrying only this plan's identity (id/name)
   * and active-status flag — every other field (account size, drawdown,
   * risk/reward, rules, current balance/days-elapsed progress) genuinely
   * goes back to blank rather than lingering from the old object. */
  function buildResetPlan(plan) {
    return { ...freshPlan(), id: plan.id, name: plan.name, isActive: plan.isActive };
  }

  let plans = [];
  let currentPlan = null;
  let handle = null;

  async function boot() {
    try {
      ({ listEvalPlans, getEvalPlan, saveEvalPlan, duplicateEvalPlan, archiveEvalPlan, setActiveEvalPlan, deleteEvalPlan, syncEvalPlanProgress } = await import('./shared/eval-service.js'));
      ({ renderEvalCalculatorPage } = await import('./shared/eval-calculator-wizard-engine.js'));
      ({ renderErrorState, renderSkeleton, showDeskToast } = await import('./shared/dayli-desk-engine.js'));
      ({ validatePlanInputs } = await import('./shared/eval-calculator-math.js'));
    } catch (err) {
      renderFallbackError(err);
      return;
    }

    renderSkeleton(root, 4);
    try {
      plans = await listEvalPlans();
      currentPlan = plans.find((p) => p.isActive) || plans[0] || null;
      if (!currentPlan) {
        currentPlan = await saveEvalPlan(freshPlan());
        plans = [currentPlan];
      }
      startPage();
    } catch (err) {
      console.error('Eval calculator load error:', err);
      renderErrorState(root, err.message || "Couldn't load your eval plans.", boot);
    }
  }

  /** A returning member with a complete, already-active plan lands on the
   * calm "welcome back" summary instead of being forced through setup
   * again; everyone else (a brand-new or still-incomplete plan) goes
   * straight into the wizard. */
  function resolveInitialViewMode() {
    return (currentPlan.isActive && validatePlanInputs(currentPlan).valid) ? 'welcome-back' : 'wizard';
  }

  let plansPanelOpen = false;

  function paintPlanBar() {
    planBar.innerHTML = `
      <button type="button" class="eval-planbar-toggle" id="evalPlansToggle">My Eval Plans ▾</button>
      <div class="eval-planbar-panel" id="evalPlansPanel" ${plansPanelOpen ? '' : 'hidden'}>
        <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;">
          <select class="field-input" id="evalPlanSelect" style="max-width:280px;">
            ${plans.map((p) => `<option value="${p.id}" ${p.id === currentPlan.id ? 'selected' : ''}>${p.name}${p.isActive ? ' (Active)' : ''}</option>`).join('')}
          </select>
          <button type="button" class="dd-secondary-btn" id="evalNewPlanBtn">+ New Plan</button>
          ${currentPlan.isActive
            ? `<span style="display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;background:var(--teal-pale);color:var(--dark);font-size:.8rem;font-weight:600;">★ Active Plan</span>`
            : `<span style="display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;background:var(--bg);color:var(--muted);font-size:.8rem;font-weight:600;">Not your active plan</span>`}
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;">
          <button type="button" class="cl-delete-link" id="evalDuplicateBtn">Duplicate</button>
          <button type="button" class="cl-delete-link" id="evalArchiveBtn">Archive</button>
          <button type="button" class="cl-delete-link" id="evalDeleteBtn">Delete Plan</button>
        </div>
      </div>`;
    planBar.querySelector('#evalPlansToggle').addEventListener('click', () => { plansPanelOpen = !plansPanelOpen; paintPlanBar(); });
    planBar.querySelector('#evalPlanSelect').addEventListener('change', async (e) => {
      currentPlan = await getEvalPlan(e.target.value);
      startPage();
    });
    planBar.querySelector('#evalNewPlanBtn').addEventListener('click', async () => {
      const created = await saveEvalPlan(freshPlan());
      plans.push(created);
      currentPlan = created;
      startPage();
    });
    planBar.querySelector('#evalDuplicateBtn').addEventListener('click', async () => {
      try {
        const copy = await duplicateEvalPlan(currentPlan.id);
        plans.push(copy);
        currentPlan = copy;
        showDeskToast('Plan duplicated ✦');
        startPage();
      } catch (err) {
        console.error('Duplicate plan error:', err);
        alert("Couldn't duplicate this plan — try again in a moment.");
      }
    });
    planBar.querySelector('#evalArchiveBtn').addEventListener('click', async () => {
      if (!confirm(`Archive "${currentPlan.name}"? You can still view it, but it won't show in your active list.`)) return;
      try {
        await archiveEvalPlan(currentPlan.id, true);
        plans = plans.filter((p) => p.id !== currentPlan.id);
        currentPlan = plans[0] || await saveEvalPlan(freshPlan());
        if (!plans.length) plans = [currentPlan];
        showDeskToast('Plan archived');
        startPage();
      } catch (err) {
        console.error('Archive plan error:', err);
        alert("Couldn't archive this plan — try again in a moment.");
      }
    });
    planBar.querySelector('#evalDeleteBtn').addEventListener('click', async () => {
      if (!confirm(`Permanently delete "${currentPlan.name}"? This can't be undone.`)) return;
      try {
        await deleteEvalPlan(currentPlan.id);
        plans = plans.filter((p) => p.id !== currentPlan.id);
        currentPlan = plans[0] || await saveEvalPlan(freshPlan());
        if (!plans.length) plans = [currentPlan];
        showDeskToast('Plan deleted');
        startPage();
      } catch (err) {
        console.error('Delete plan error:', err);
        alert("Couldn't delete this plan — try again in a moment.");
      }
    });
  }

  function startPage() {
    plansPanelOpen = false;
    paintPlanBar();
    handle = renderEvalCalculatorPage(root, currentPlan, {
      onChange: (next) => { currentPlan = next; autosave(next); },
      onReset: async () => {
        if (!confirm(`Reset all fields on "${currentPlan.name}"? This clears your inputs back to blank — it won't delete this plan or create a new one.`)) return;
        try {
          const saved = await saveEvalPlan(buildResetPlan(currentPlan));
          currentPlan = saved;
          const idx = plans.findIndex((p) => p.id === saved.id);
          if (idx >= 0) plans[idx] = saved;
          showDeskToast('Plan reset ✦');
          startPage();
        } catch (err) {
          console.error('Reset plan error:', err);
          alert("Couldn't reset this plan — try again in a moment.");
        }
      },
      onSaveExplicit: async (plan) => {
        clearTimeout(saveTimer);
        const saved = await saveEvalPlan(plan);
        let finalPlan = saved;
        if (!saved.isActive) {
          finalPlan = await setActiveEvalPlan(saved.id);
          plans = plans.map((p) => ({ ...p, isActive: p.id === saved.id }));
        }
        currentPlan = finalPlan;
        const idx = plans.findIndex((p) => p.id === finalPlan.id);
        if (idx >= 0) plans[idx] = finalPlan;
        return finalPlan;
      },
      onUpdateProgress: async (currentBalance, tradingDaysElapsed) => {
        const updated = await syncEvalPlanProgress(currentPlan.id, { currentBalance, tradingDaysElapsed });
        currentPlan = updated;
        const idx = plans.findIndex((p) => p.id === updated.id);
        if (idx >= 0) plans[idx] = updated;
        return updated;
      },
      onCreateAnother: async () => {
        const created = await saveEvalPlan(freshPlan());
        plans.push(created);
        currentPlan = created;
        startPage();
      },
      initialViewMode: resolveInitialViewMode(),
    });
    loadActualVsPlanned();
  }

  async function loadActualVsPlanned() {
    try {
      const { listEntries } = await import('./shared/journal-service.js');
      const { computeActualVsPlanned } = await import('./shared/eval-calculator-math.js');
      const { entries } = await listEntries({ entryType: 'trade', limit: 500 });
      handle.setActualVsPlanned(computeActualVsPlanned(currentPlan, entries));
    } catch (err) {
      console.error('Actual-vs-planned load error:', err); // non-critical — the calculator still works without it
    }
  }

  let saveTimer = null;
  function autosave(plan) {
    handle.setSaveStatus('saving');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async () => {
      try {
        const saved = await saveEvalPlan(plan);
        handle.applySavedFields(saved);
        handle.setSaveStatus('saved');
        const idx = plans.findIndex((p) => p.id === saved.id);
        if (idx >= 0) plans[idx] = { ...plans[idx], name: saved.name };
      } catch (err) {
        console.error('Eval plan autosave error:', err);
        handle.setSaveStatus('error');
      }
    }, 700);
  }

  document.addEventListener('aghf-auth-ready', boot);
</script>

</body>
</html>
