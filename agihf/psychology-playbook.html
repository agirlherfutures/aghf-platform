<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Trading Psychology Playbook — A Girl & Her Futures</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,700;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/tokens.css">
<link rel="stylesheet" href="shared/sidebar.css">
<link rel="stylesheet" href="shared/components.css">
<link rel="stylesheet" href="shared/dayli-desk.css">
</head>
<body>

<script src="shared/auth-guard.js"></script>
<script src="shared/sidebar.js" data-active="agent"></script>

<main class="main">
  <div class="dd-header-top">
    <div>
      <div class="pg-eye">✦ My Trading Psychology Playbook</div>
      <div class="pg-title">What you’re learning about how you actually trade.</div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <a class="dd-secondary-btn" href="playbook.html">Looking for your Lesson Notes? →</a>
      <a class="dd-secondary-btn" href="psychology.html">← AGHF Agent</a>
    </div>
  </div>
  <div class="dd-section" id="psyPlaybookArea"></div>
</main>

<script type="module">
  let listPlaybookItems, savePlaybookItem, deletePlaybookItem;
  let renderPlaybook;
  let renderSkeleton, renderErrorState, showDeskToast;

  function renderFallbackError(err) {
    console.error('Psychology Playbook page failed to load:', err);
    document.querySelector('.main').innerHTML = `
      <div style="max-width:520px;margin:40px auto;padding:28px;background:#fff;border-radius:16px;border:1px solid #F1E7E1;text-align:center;">
        <div style="font-size:1.1rem;font-weight:700;color:#3D2B20;margin-bottom:8px;">Something went wrong loading this page</div>
        <div style="font-size:.88rem;color:#7A5C50;margin-bottom:18px;word-break:break-word;">${(err && err.message) ? err.message : 'An unexpected error occurred.'}</div>
        <button type="button" onclick="location.reload()" style="padding:10px 22px;border-radius:999px;border:none;background:#F4829A;color:#fff;font-weight:600;cursor:pointer;">Reload</button>
      </div>`;
  }

  const area = document.getElementById('psyPlaybookArea');

  async function load() {
    renderSkeleton(area, 3);
    try {
      const items = await listPlaybookItems();
      renderPlaybook(area, items, {
        onAdd: async (data) => { await savePlaybookItem(data); showDeskToast('Saved to your Playbook ✦'); load(); },
        onUpdate: async (data) => { await savePlaybookItem(data); load(); },
        onDelete: async (id) => { await deletePlaybookItem(id); load(); },
      });
    } catch (err) {
      console.error('Playbook load error:', err);
      renderErrorState(area, err.setupRequired ? err.message : 'Couldn’t load your Playbook.', load);
    }
  }

  document.addEventListener('aghf-auth-ready', boot);

  async function boot() {
    try {
      ({ listPlaybookItems, savePlaybookItem, deletePlaybookItem } = await import('./shared/psychology-service.js'));
      ({ renderPlaybook } = await import('./shared/psychology-engine.js'));
      ({ renderSkeleton, renderErrorState, showDeskToast } = await import('./shared/dayli-desk-engine.js'));
    } catch (err) {
      renderFallbackError(err);
      return;
    }
    load();
  }
</script>

</body>
</html>
