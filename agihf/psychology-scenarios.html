<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scenario Lab — A Girl & Her Futures</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,700;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/tokens.css">
<link rel="stylesheet" href="shared/sidebar.css">
<link rel="stylesheet" href="shared/components.css">
<link rel="stylesheet" href="shared/dayli-desk.css">
</head>
<body>

<script src="shared/auth-guard.js"></script>
<script src="shared/sidebar.js" data-active="agent"></script>

<main class="main">
  <div class="dd-header-top">
    <div>
      <div class="pg-eye">✦ Psychology Scenario Lab</div>
      <div class="pg-title">Practice a decision. No money at risk.</div>
    </div>
    <a class="dd-secondary-btn" href="psychology.html">← AGHF Agent</a>
  </div>
  <div class="dd-section">
    <div class="dd-card" id="psyScenarioArea"></div>
  </div>
</main>

<script type="module">
  let PSYCHOLOGY_SCENARIOS, getScenarioById;
  let renderScenarioList, renderScenarioAttempt;
  let saveScenarioAttempt;
  let showDeskToast;

  const area = document.getElementById('psyScenarioArea');

  function showList() {
    history.replaceState(null, '', 'psychology-scenarios.html');
    renderScenarioList(area, PSYCHOLOGY_SCENARIOS, { onOpen: (id) => showAttempt(id) });
  }

  function showAttempt(id) {
    const scenario = getScenarioById(id);
    if (!scenario) return showList();
    history.replaceState(null, '', `psychology-scenarios.html?id=${id}`);
    renderScenarioAttempt(area, scenario, {
      onComplete: async (attempt) => {
        try {
          await saveScenarioAttempt(attempt);
          showDeskToast('Scenario saved to your history ✦');
        } catch (err) {
          console.error('Could not save scenario attempt:', err);
        }
        setTimeout(showList, 900);
      },
    });
  }

  (async function boot() {
    try {
      ({ PSYCHOLOGY_SCENARIOS, getScenarioById } = await import('./shared/psychology-scenarios-data.js'));
      ({ renderScenarioList, renderScenarioAttempt } = await import('./shared/psychology-engine.js'));
      ({ saveScenarioAttempt } = await import('./shared/psychology-service.js'));
      ({ showDeskToast } = await import('./shared/dayli-desk-engine.js'));
    } catch (err) {
      console.error('Scenario Lab failed to load:', err);
      area.innerHTML = `
        <div style="max-width:520px;margin:40px auto;padding:28px;background:#fff;border-radius:16px;border:1px solid #F1E7E1;text-align:center;">
          <div style="font-size:1.1rem;font-weight:700;color:#3D2B20;margin-bottom:8px;">Something went wrong loading the Scenario Lab</div>
          <div style="font-size:.88rem;color:#7A5C50;margin-bottom:18px;word-break:break-word;">${(err && err.message) ? err.message : 'An unexpected error occurred.'}</div>
          <button type="button" onclick="location.reload()" style="padding:10px 22px;border-radius:999px;border:none;background:#F4829A;color:#fff;font-weight:600;cursor:pointer;">Reload</button>
        </div>`;
      return;
    }

    const params = new URLSearchParams(window.location.search);
    if (params.get('id')) showAttempt(params.get('id')); else showList();
  })();
</script>

</body>
</html>
