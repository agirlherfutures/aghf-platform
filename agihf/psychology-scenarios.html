<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scenario Lab — A Girl & Her Futures</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,700;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/tokens.css">
<link rel="stylesheet" href="shared/sidebar.css">
<link rel="stylesheet" href="shared/components.css">
<link rel="stylesheet" href="shared/dayli-desk.css">
</head>
<body>

<script src="shared/auth-guard.js"></script>
<script src="shared/sidebar.js" data-active="psychology"></script>

<main class="main">
  <div class="dd-header-top">
    <div>
      <div class="pg-eye">✦ Psychology Scenario Lab</div>
      <div class="pg-title">Practice a decision. No money at risk.</div>
    </div>
    <a class="dd-secondary-btn" href="psychology.html">← Coach Home</a>
  </div>
  <div class="dd-section">
    <div class="dd-card" id="psyScenarioArea"></div>
  </div>
</main>

<script type="module">
  import { PSYCHOLOGY_SCENARIOS, getScenarioById } from './shared/psychology-scenarios-data.js';
  import { renderScenarioList, renderScenarioAttempt } from './shared/psychology-engine.js';
  import { saveScenarioAttempt } from './shared/psychology-service.js';
  import { showDeskToast } from './shared/dayli-desk-engine.js';

  const area = document.getElementById('psyScenarioArea');

  function showList() {
    history.replaceState(null, '', 'psychology-scenarios.html');
    renderScenarioList(area, PSYCHOLOGY_SCENARIOS, { onOpen: (id) => showAttempt(id) });
  }

  function showAttempt(id) {
    const scenario = getScenarioById(id);
    if (!scenario) return showList();
    history.replaceState(null, '', `psychology-scenarios.html?id=${id}`);
    renderScenarioAttempt(area, scenario, {
      onComplete: async (attempt) => {
        try {
          await saveScenarioAttempt(attempt);
          showDeskToast('Scenario saved to your history ✦');
        } catch (err) {
          console.error('Could not save scenario attempt:', err);
        }
        setTimeout(showList, 900);
      },
    });
  }

  const params = new URLSearchParams(window.location.search);
  if (params.get('id')) showAttempt(params.get('id')); else showList();
</script>

</body>
</html>
