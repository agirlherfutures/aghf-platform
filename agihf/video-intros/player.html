<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AGHF Lesson Intro</title>
<link href="fonts/fonts.css" rel="stylesheet">
<!--
  Lesson intro video player — A Girl & Her Futures™

  One template for every lesson. Load a lesson's data file via ?lesson=lesson-01
  (reads lessons/lesson-01.js). Rendering is deterministic: window.render(t)
  draws the exact frame for time t, so render.cjs can step through it frame by
  frame. Open in a browser to preview (plays in real time; space = pause).
  Add &captions=1 to show the narration script along the bottom.
-->
<style>
:root{
  --pink:#F4829A;--pink-light:#F9B8C6;--pink-pale:#FDE8ED;
  --teal:#7ECEC4;--teal-light:#B2E4DF;--teal-pale:#E8F8F6;
  --peach:#F5A857;--peach-light:#FAD09A;--peach-pale:#FEF3E4;
  --purple:#7F77DD;--purple-light:#CECBF6;--purple-pale:#EEEDFE;
  --cream:#FDF8F5;--warm:#FFFBF9;--dark:#2C1810;--text:#3D2B20;--muted:#7A5C50;--border:#F1E7E1;
  --font-display:'Playfair Display',serif;--font-body:'DM Sans',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--cream);}
body{font-family:var(--font-body);color:var(--text);font-variant-numeric:lining-nums;}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--cream);}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55;}
.chrome{position:absolute;top:56px;left:80px;right:80px;display:flex;align-items:center;justify-content:space-between;z-index:5;}
.brand{display:flex;align-items:center;gap:18px;font-family:var(--font-display);font-weight:700;font-size:28px;color:var(--dark);}
.brand img{width:64px;height:64px;}
.eyebrow{font-size:22px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}
.progress{position:absolute;left:0;bottom:0;height:8px;background:linear-gradient(90deg,var(--pink),var(--peach),var(--teal),var(--purple));z-index:6;}

.scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:150px 160px 140px;}
.kicker{display:inline-block;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--pink);background:var(--pink-pale);padding:12px 26px;border-radius:999px;margin-bottom:34px;}
.h1{font-family:var(--font-display);font-weight:900;font-size:128px;line-height:1.02;color:var(--dark);text-align:center;letter-spacing:-.01em;}
.h2{font-family:var(--font-display);font-weight:700;font-size:72px;line-height:1.1;color:var(--dark);text-align:center;margin-bottom:56px;}
.big{font-family:var(--font-display);font-weight:700;font-size:88px;line-height:1.15;color:var(--dark);text-align:center;max-width:1500px;}
.big + .big{margin-top:26px;}
.mark{background:linear-gradient(transparent 62%,var(--peach-light) 62%);padding:0 6px;}
.strike{position:relative;display:inline-block;color:var(--muted);}
.strike i{position:absolute;left:-4px;right:-4px;top:54%;height:8px;border-radius:4px;background:var(--pink);transform-origin:left center;}
.sub{font-size:34px;color:var(--muted);text-align:center;}
.phase-pill{font-size:28px;font-weight:500;color:var(--purple);background:var(--purple-pale);padding:12px 28px;border-radius:999px;margin-bottom:40px;}
.title-quote{margin-top:56px;font-family:var(--font-display);font-style:italic;font-size:40px;color:var(--muted);max-width:1300px;text-align:center;}

.cards{display:flex;gap:56px;justify-content:center;width:100%;}
.card{background:#fff;border:2px solid var(--border);border-radius:36px;box-shadow:0 24px 60px rgba(44,24,16,.08);}
.ls-card{width:640px;padding:44px 48px;}
.ls-label{display:flex;align-items:center;gap:18px;font-family:var(--font-display);font-weight:900;font-size:64px;color:var(--dark);}
.ls-arrow{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:700;color:#fff;}
.ls-desc{font-size:34px;color:var(--muted);margin:10px 0 18px;}
.ls-card svg{width:100%;height:190px;}
.footer-pill{margin-top:56px;font-size:36px;font-weight:500;color:var(--dark);background:var(--teal-pale);border:2px solid var(--teal-light);padding:20px 40px;border-radius:999px;}

.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:36px;width:100%;}
.g-card{padding:46px 36px 50px;text-align:center;}
.g-num{width:96px;height:96px;margin:0 auto 26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:900;font-size:50px;}
.g-label{font-family:var(--font-display);font-weight:900;font-size:52px;color:var(--dark);margin-bottom:12px;}
.g-desc{font-size:31px;color:var(--muted);line-height:1.3;}

.cmp{display:flex;flex-direction:column;gap:44px;width:1400px;}
.cmp-row{padding:40px 50px;}
.cmp-head{display:flex;align-items:baseline;gap:28px;margin-bottom:24px;}
.cmp-label{font-family:var(--font-display);font-weight:900;font-size:60px;color:var(--dark);}
.cmp-desc{font-size:34px;color:var(--muted);}
.cmp-track{height:28px;border-radius:14px;background:var(--cream);overflow:hidden;}
.cmp-bar{height:100%;border-radius:14px;}
.cmp-scale{display:flex;justify-content:space-between;font-size:22px;color:var(--muted);margin-top:10px;letter-spacing:.06em;text-transform:uppercase;}

.duo{display:flex;align-items:center;justify-content:center;gap:40px;width:100%;}
.duo-card{width:600px;min-height:300px;padding:44px 48px;}
.duo-quote{font-family:var(--font-display);font-style:italic;font-size:40px;line-height:1.25;color:var(--text);margin-top:18px;}
.duo-mid{font-size:30px;font-weight:700;color:var(--dark);background:var(--peach-pale);border:2px solid var(--peach-light);padding:18px 30px;border-radius:999px;white-space:nowrap;}
.mission-q{font-family:var(--font-display);font-weight:700;font-size:92px;line-height:1.15;color:var(--dark);text-align:center;max-width:1500px;}
.cta{margin-top:64px;font-size:40px;font-weight:700;color:#fff;background:var(--pink);padding:24px 56px;border-radius:999px;box-shadow:0 18px 40px rgba(244,130,154,.35);}

.scene.illus{padding:0;display:block;}
.art{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:visible;}
.abs{position:absolute;}
.top{position:absolute;left:0;right:0;top:150px;display:flex;flex-direction:column;align-items:center;}
.top .h2{margin-bottom:0;padding:0 120px;}
.bottom{position:absolute;left:0;right:0;bottom:60px;display:flex;justify-content:center;}
#captions{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);width:1500px;background:rgba(44,24,16,.86);border-radius:28px;padding:22px 40px;z-index:10;display:none;}
#captions .now{font-size:36px;font-weight:500;color:#fff;line-height:1.3;}
#captions .next{font-size:24px;color:rgba(255,255,255,.55);margin-top:8px;}
#captions .clock{position:absolute;right:28px;top:-40px;font-size:22px;font-weight:700;color:var(--dark);background:#fff;padding:6px 14px;border-radius:10px;}
body.captions #captions{display:block;}
body.captions .scene{padding-bottom:230px;}
</style>
</head>
<body>
<div id="stage">
  <div class="blob" id="b1" style="width:760px;height:760px;background:var(--pink-light)"></div>
  <div class="blob" id="b2" style="width:680px;height:680px;background:var(--peach-light)"></div>
  <div class="blob" id="b3" style="width:620px;height:620px;background:var(--teal-light)"></div>
  <div class="chrome">
    <div class="brand"><img src="../shared/img/aghf-logo.png" alt="">A Girl &amp; Her Futures</div>
    <div class="eyebrow" id="eyebrow"></div>
  </div>
  <div id="scenes"></div>
  <div class="progress" id="progress"></div>
  <div id="captions"><div class="clock" id="clock"></div><div class="now" id="capNow"></div><div class="next" id="capNext"></div></div>
</div>

<script>
const params = new URLSearchParams(location.search);
const lessonSlug = params.get('lesson') || 'lesson-01';
if (params.get('captions') === '1') document.body.classList.add('captions');
document.write('<script src="illustrations.js"><\/script><script src="scenes-illustrated.js"><\/script>');
document.write('<script src="lessons/' + lessonSlug + '.js"><\/script>');
</script>
<script>
const V = window.LESSON_VIDEO;
const C = { pink: 'var(--pink)', teal: 'var(--teal)', peach: 'var(--peach)', purple: 'var(--purple)' };
const PALE = { pink: 'var(--pink-pale)', teal: 'var(--teal-pale)', peach: 'var(--peach-pale)', purple: 'var(--purple-pale)' };
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');

// Wrap the matching phrase of a line in a highlight or a strike-through.
function decorate(p) {
  let html = esc(p.text);
  if (p.highlight) html = html.replace(esc(p.highlight), `<span class="mark">${esc(p.highlight)}</span>`);
  if (p.strike) html = html.replace(esc(p.strike), `<span class="strike">${esc(p.strike)}<i data-grow="${p.at + 0.9}"></i></span>`);
  return html;
}

// Price-path SVG for the long/short cards. The path draws on as time passes.
function pathSvg(up, color, at) {
  const pts = up
    ? [[20,160],[90,140],[150,150],[220,110],[290,122],[360,80],[430,92],[520,40]]
    : [[20,40],[90,62],[150,52],[220,96],[290,84],[360,126],[430,114],[520,166]];
  const d = 'M' + pts.map(p => p.join(',')).join(' L');
  const end = pts[pts.length - 1];
  return `<svg viewBox="0 0 544 190"><path d="${d}" fill="none" stroke="${color}" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" pathLength="1" data-draw="${at + 0.4}" data-dur="1.8"/>
    <circle cx="${end[0]}" cy="${end[1]}" r="14" fill="${color}" data-in="${at + 2.1}" data-anim="pop"/></svg>`;
}

const BUILD = {
  title: s => `
    <div class="phase-pill" data-in="${s.start + 0.3}">${esc(s.phase)}</div>
    <div class="h1" data-in="${s.start + 0.8}">${esc(s.title)}</div>
    <div class="title-quote" data-in="${s.start + 2.4}">“${esc(s.quote)}”</div>`,
  hook: s => `
    <div class="kicker" data-in="${s.start + 0.4}">${esc(s.kicker)}</div>
    ${s.parts.map(p => `<div class="big" data-in="${p.at}">${decorate(p)}</div>`).join('')}`,
  longshort: s => `
    <div class="kicker" data-in="${s.start + 0.3}">${esc(s.kicker)}</div>
    <div class="h2" data-in="${s.start + 0.6}">${esc(s.title)}</div>
    <div class="cards">
      ${[[s.long, true, 'var(--teal)', '↑'], [s.short, false, 'var(--pink)', '↓']].map(([x, up, col, arrow]) => `
      <div class="card ls-card" data-in="${x.at}">
        <div class="ls-label"><span class="ls-arrow" style="background:${col}">${arrow}</span>${esc(x.label)}</div>
        <div class="ls-desc">${esc(x.desc)}</div>
        ${pathSvg(up, col, x.at)}
      </div>`).join('')}
    </div>
    <div class="footer-pill" data-in="${s.footer.at}">${esc(s.footer.text)}</div>`,
  grid4: s => `
    <div class="kicker" data-in="${s.start + 0.3}">${esc(s.kicker)}</div>
    <div class="h2" data-in="${s.start + 0.6}">${esc(s.title)}</div>
    <div class="grid4" style="grid-template-columns:repeat(${s.items.length},1fr)">
      ${s.items.map((it, i) => `
      <div class="card g-card" data-in="${it.at}" data-focus="${it.at}" data-focus-end="${(s.items[i + 1] || { at: s.end - 0.6 }).at}" style="--accent:${C[it.color]}">
        <div class="g-num" style="background:${PALE[it.color]};color:${C[it.color]}">${i + 1}</div>
        <div class="g-label">${esc(it.label)}</div>
        <div class="g-desc">${esc(it.desc)}</div>
      </div>`).join('')}
    </div>`,
  compare: s => `
    <div class="kicker" data-in="${s.start + 0.3}">${esc(s.kicker)}</div>
    <div class="cmp">
      ${[s.left, s.right].map(x => `
      <div class="card cmp-row" data-in="${x.at}">
        <div class="cmp-head"><div class="cmp-label">${esc(x.label)}</div><div class="cmp-desc">${esc(x.desc)}</div></div>
        <div class="cmp-track"><div class="cmp-bar" style="background:${C[x.color]}" data-bar="${x.bar}" data-bar-at="${x.at + 0.5}"></div></div>
        <div class="cmp-scale"><span>Short window</span><span>Years</span></div>
      </div>`).join('')}
    </div>`,
  duo: s => `
    <div class="kicker" data-in="${s.start + 0.3}">${esc(s.kicker)}</div>
    <div class="h2" data-in="${s.start + 0.6}">${esc(s.title)}</div>
    <div class="duo">
      ${[s.left, 'mid', s.right].map(x => x === 'mid'
        ? `<div class="duo-mid" data-in="${s.middle.at}" data-anim="pop">${esc(s.middle.text)}</div>`
        : `<div class="card duo-card" data-in="${x.at}">
        <div class="ls-label"><span class="ls-arrow" style="background:${C[x.color]};font-family:var(--font-display)">${esc(x.icon)}</span>${esc(x.label)}</div>
        <div class="duo-quote">“${esc(x.quote)}”</div>
      </div>`).join('')}
    </div>
    <div class="footer-pill" data-in="${s.footer.at}">${esc(s.footer.text)}</div>`,
  remember: s => `
    <div class="kicker" data-in="${s.start + 0.3}">${esc(s.kicker)}</div>
    ${s.parts.map(p => `<div class="big" data-in="${p.at}">${decorate(p)}</div>`).join('')}`,
  mission: s => `
    <div class="kicker" data-in="${s.start + 0.3}">${esc(s.kicker)}</div>
    <div class="mission-q" data-in="${s.question.at}">${esc(s.question.text)}</div>
    <div class="cta" data-in="${s.cta.at}" data-anim="pop">${esc(s.cta.text)} →</div>`,
};

document.getElementById('eyebrow').textContent = V.eyebrow;
const host = document.getElementById('scenes');
const sceneEls = V.scenes.map((s, i) => {
  const el = document.createElement('div');
  const illus = window.ILLUS && window.ILLUS.BUILD[s.type];
  el.className = illus ? 'scene illus' : 'scene';
  el.innerHTML = illus ? '<svg class="art" viewBox="0 0 1920 1080"></svg>' + illus(s) : BUILD[s.type](s);
  el._scene = s;
  el.dataset.start = s.start; el.dataset.end = s.end; el.dataset.last = i === V.scenes.length - 1 ? '1' : '';
  host.appendChild(el);
  return el;
});
const allLines = V.scenes.flatMap(s => s.lines);
// True while a narration line is being read (about 0.36s per word), so characters can talk.
const talkingAt = t => allLines.some(l => t >= l.at && t < l.at + l.text.split(/\s+/).length * 0.36 + 0.2);

const clamp = x => Math.max(0, Math.min(1, x));
const ease = x => 1 - Math.pow(1 - clamp(x), 3);
const back = x => { x = clamp(x); const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };

window.render = function (t) {
  // Slow-drifting background blobs.
  const b = [['b1', -120, -160, 0.11, 70], ['b2', 1320, 520, 0.08, 90], ['b3', 1100, -260, 0.06, 60]];
  b.forEach(([id, x, y, sp, amp]) => {
    document.getElementById(id).style.transform =
      `translate(${x + Math.sin(t * sp) * amp}px, ${y + Math.cos(t * sp * 1.3) * amp}px)`;
  });
  document.getElementById('progress').style.width = (clamp(t / V.duration) * 100) + '%';

  sceneEls.forEach(el => {
    const st = +el.dataset.start, en = +el.dataset.end;
    const fadeIn = st === 0 ? 1 : ease((t - st) / 0.5);
    const fadeOut = el.dataset.last ? 1 : 1 - ease((t - (en - 0.5)) / 0.5);
    const op = (t >= st - 0.01 && t <= en + 0.01) ? fadeIn * fadeOut : 0;
    el.style.opacity = op;
    el.style.visibility = op > 0 ? 'visible' : 'hidden';
    if (op <= 0) return;

    const live = window.ILLUS && window.ILLUS.LIVE[el._scene.type];
    if (live) el.querySelector('.art').innerHTML = live(el._scene, t, { talking: talkingAt(t) });

    el.querySelectorAll('[data-in]').forEach(n => {
      const p = (t - +n.dataset.in) / 0.7;
      if (n.dataset.anim === 'pop') {
        n.style.opacity = clamp(p * 2);
        n.style.transform = `scale(${0.6 + 0.4 * back(p)})`;
        n.style.transformBox = 'fill-box'; n.style.transformOrigin = 'center';
      } else {
        n.style.opacity = ease(p);
        n.style.transform = `translateY(${(1 - ease(p)) * 40}px)`;
      }
      if (n.dataset.out) n.style.opacity = +n.style.opacity * (1 - ease((t - +n.dataset.out) / 0.4));
    });
    el.querySelectorAll('[data-draw]').forEach(n => {
      const p = ease((t - +n.dataset.draw) / +n.dataset.dur);
      n.style.strokeDasharray = '1'; n.style.strokeDashoffset = String(1 - p);
    });
    el.querySelectorAll('[data-grow]').forEach(n => {
      n.style.transform = `scaleX(${ease((t - +n.dataset.grow) / 0.6)})`;
    });
    el.querySelectorAll('[data-bar]').forEach(n => {
      n.style.width = (ease((t - +n.dataset.barAt) / 1.4) * +n.dataset.bar * 100) + '%';
    });
    el.querySelectorAll('[data-focus]').forEach(n => {
      // The card being narrated lifts and takes its accent border.
      const on = t >= +n.dataset.focus && t < +n.dataset.focusEnd;
      const k = on ? ease((t - +n.dataset.focus) / 0.4) : 0;
      n.style.borderColor = on ? n.style.getPropertyValue('--accent') : '';
      n.style.transform = `translateY(${-14 * k}px) scale(${1 + 0.04 * k})`;
      n.style.boxShadow = on ? '0 30px 70px rgba(44,24,16,.14)' : '';
    });
  });

  // Narration captions (only visible with ?captions=1).
  let idx = -1;
  allLines.forEach((l, i) => { if (t >= l.at - 0.2) idx = i; });
  document.getElementById('capNow').textContent = idx >= 0 ? allLines[idx].text : '';
  const nxt = allLines[idx + 1];
  document.getElementById('capNext').textContent = nxt ? 'Next: ' + nxt.text : '';
  const s = Math.floor(t);
  document.getElementById('clock').textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
};

window.VIDEO_DURATION = V.duration;
window.render(0);

// Real-time preview when opened in a normal browser (render.cjs sets ?render=1).
if (params.get('render') !== '1') {
  let t0 = performance.now(), paused = false, held = 0;
  document.addEventListener('keydown', e => {
    if (e.code !== 'Space') return;
    paused = !paused;
    if (paused) held = (performance.now() - t0) / 1000; else t0 = performance.now() - held * 1000;
  });
  const tick = () => {
    if (!paused) window.render(Math.min(V.duration, (performance.now() - t0) / 1000));
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
</script>
</body>
</html>
