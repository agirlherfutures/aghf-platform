<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A Life of HER Own</title>
<link href="../fonts/fonts.css" rel="stylesheet">
<!--
  "A Life of HER Own": 60-second vertical lifestyle commercial for
  A Girl & Her Futures Academy™ (1080x1920, 30 fps, silent, burned-in captions).

  Same deterministic approach as tiktok.html: window.render(t) draws the exact
  frame for time t (a pure function of t), so render-her-own.cjs can step through
  it frame by frame. Open in a browser to preview in real time (space = pause).
    ?guides=1  overlays the TikTok safe zone (top 150, bottom 400, right 140)
    ?t=12.5    opens paused on that frame
    ?cast=1    shows the cast sheet (character turnaround) instead of the spot
  Art comes from ../illustrations.js (window.ART) and scenes-her-own.js (window.HO).
  Real Academy screens live in ./assets and are drawn as SVG <image> elements.
-->
<style>
:root{
  --pink:#F4829A;--teal:#7ECEC4;--peach:#F5A857;--purple:#7F77DD;
  --cream:#FFFBF9;--dark:#2C1810;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1080px;height:1920px;overflow:hidden;background:#2C1810;}
body{font-family:'DM Sans',sans-serif;font-variant-numeric:lining-nums;}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#2C1810;}
#art{position:absolute;left:0;top:0;width:1080px;height:1920px;}
#logo{position:absolute;left:0;top:0;width:400px;height:400px;opacity:0;transform-origin:200px 200px;will-change:transform;}
#preload{position:absolute;left:-4000px;top:0;width:10px;height:10px;overflow:hidden;}
#cap{position:absolute;left:60px;width:820px;display:flex;justify-content:center;align-items:flex-end;z-index:10;pointer-events:none;}
#capBox{background:rgba(44,24,16,.66);border-radius:28px;padding:16px 32px 19px;text-align:center;
  font-weight:500;font-size:46px;line-height:1.3;color:#FFFBF9;letter-spacing:.2px;text-wrap:balance;
  box-shadow:0 12px 36px rgba(44,24,16,.22);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);}
#guides{position:absolute;inset:0;z-index:20;pointer-events:none;display:none;}
body.guides #guides{display:block;}
#guides div{position:absolute;background:rgba(0,120,255,.18);border:2px dashed rgba(0,90,220,.7);}
</style>
</head>
<body>
<div id="stage">
  <svg id="art" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"></svg>
  <img id="logo" src="../../shared/img/aghf-logo.png" alt="">
  <div id="cap"><div id="capBox"></div></div>
  <div id="guides">
    <div style="left:0;top:0;width:1080px;height:150px"></div>
    <div style="left:0;top:1520px;width:1080px;height:400px"></div>
    <div style="left:940px;top:150px;width:140px;height:1370px"></div>
  </div>
  <div id="preload">
    <img src="assets/01-curriculum.jpg" alt=""><img src="assets/02-candles-vs-structure.jpg" alt="">
    <img src="assets/03-dots-to-structure.jpg" alt=""><img src="assets/04-dayli-says.jpg" alt="">
    <img src="assets/05-lesson-complete.jpg" alt=""><img src="assets/06-lesson-video.jpg" alt="">
  </div>
</div>
<script src="../illustrations.js"></script>
<script src="scenes-her-own.js"></script>
<script>
const params = new URLSearchParams(location.search);
if (params.get('guides') === '1') document.body.classList.add('guides');
const HO = window.HO;
const castMode = params.get('cast') === '1';
const clamp = x => Math.max(0, Math.min(1, x));
const ease = x => 1 - Math.pow(1 - clamp(x), 3);

const art = document.getElementById('art');
const logo = document.getElementById('logo');
const cap = document.getElementById('cap');
const capBox = document.getElementById('capBox');

// Captions: one phrase at a time, soft fade and rise; held until the next phrase.
const CAPS = HO.CAPTIONS;
let builtIdx = -2;
function buildCap(i) {
  if (i === builtIdx) return;
  builtIdx = i;
  capBox.textContent = i < 0 ? '' : CAPS[i].text;
}

window.render = function (t) {
  art.innerHTML = castMode ? HO.castSheet(t) : HO.draw(t);

  const L = castMode ? null : HO.logo(t);
  if (L && L.op > 0) {
    logo.style.opacity = L.op;
    logo.style.transform = `translate(${L.x - 200}px, ${L.y - 200}px) scale(${L.size / 400}) rotate(${L.rot || 0}deg)`;
  } else logo.style.opacity = 0;

  let idx = -1;
  if (!castMode) CAPS.forEach((c, i) => { if (t >= c.at && t < c.end) idx = i; });
  buildCap(idx);
  if (idx >= 0) {
    const n = CAPS[idx];
    cap.style.bottom = (1920 - HO.CAP_BOTTOM) + 'px';
    const kin = ease((t - n.at) / 0.32), kout = 1 - ease((t - (n.end - 0.16)) / 0.16);
    capBox.style.opacity = (kin * kout).toFixed(3);
    capBox.style.transform = `translateY(${((1 - kin) * 14).toFixed(1)}px)`;
  } else capBox.style.opacity = 0;
};

window.VIDEO_DURATION = HO.DURATION;

if (params.get('render') !== '1') {
  const start = params.get('t') != null ? +params.get('t') : null;
  if (start != null) window.render(start);
  else {
    let t0 = performance.now(), paused = false, held = 0;
    document.addEventListener('keydown', e => {
      if (e.code !== 'Space') return;
      paused = !paused;
      if (paused) held = (performance.now() - t0) / 1000; else t0 = performance.now() - held * 1000;
    });
    const tick = () => {
      if (!paused) window.render(((performance.now() - t0) / 1000) % HO.DURATION);
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }
} else window.render(0);
</script>
</body>
</html>
