<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trader Resource Library — A Girl & Her Futures</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,700;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/tokens.css">
<link rel="stylesheet" href="shared/sidebar.css">
<link rel="stylesheet" href="shared/components.css">
<link rel="stylesheet" href="shared/dayli-desk.css">
<style>
  /* Page-specific layout only — cards/buttons/modal reuse .dd-card,
   * .dd-primary-btn, .dd-secondary-btn and .modal-overlay/.modal-card. */
  .visually-hidden{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
  .rl-head{margin-bottom:26px;max-width:640px;}
  .rl-title-row{display:flex;align-items:center;flex-wrap:wrap;gap:10px 14px;margin-bottom:8px;}
  .rl-title-row .pg-title{margin-bottom:0;line-height:1.15;}
  .rl-free-badge{display:inline-flex;align-items:center;gap:6px;background:var(--teal-pale);color:#1a6b63;border:1px solid var(--teal-light);font-size:.72rem;font-weight:700;padding:4px 11px;border-radius:100px;white-space:nowrap;}
  .rl-free-badge::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--teal);}
  .rl-sub{font-size:.93rem;color:var(--muted);line-height:1.65;}

  .rl-grid{display:grid;grid-template-columns:1fr;gap:14px;list-style:none;margin-bottom:30px;}
  @media(min-width:640px){.rl-grid{grid-template-columns:1fr 1fr;}}
  @media(min-width:1180px){.rl-grid{grid-template-columns:repeat(3,1fr);}}
  .rl-card{display:flex;flex-direction:column;gap:10px;height:100%;}
  .rl-card-top{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .rl-icon{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
  .rl-tone-pink .rl-icon{background:var(--pink-pale);}
  .rl-tone-teal .rl-icon{background:var(--teal-pale);}
  .rl-tone-peach .rl-icon{background:var(--peach-pale);}
  .rl-tone-purple .rl-icon{background:var(--purple-pale);}
  .rl-format{font-size:.64rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);background:var(--cream);border:1px solid var(--border);padding:3px 9px;border-radius:100px;white-space:nowrap;}
  .rl-cat{font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;}
  .rl-tone-pink .rl-cat{color:#b83d5e;}
  .rl-tone-teal .rl-cat{color:#1a6b63;}
  .rl-tone-peach .rl-cat{color:#9a5a0c;}
  .rl-tone-purple .rl-cat{color:#5249b8;}
  .rl-card-title{font-family:var(--font-display);font-size:1.08rem;font-weight:700;color:var(--dark);line-height:1.25;margin-top:-4px;}
  .rl-card-desc{font-size:.84rem;color:var(--muted);line-height:1.6;flex:1;}
  .rl-card .dd-secondary-btn{align-self:flex-start;margin-top:4px;}

  .rl-cta{background:linear-gradient(135deg,var(--pink-pale),var(--peach-pale));border-radius:18px;padding:22px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px 24px;flex-wrap:wrap;}
  .rl-cta-text{flex:1;min-width:240px;}
  .rl-cta-title{font-family:var(--font-display);font-size:1.05rem;font-weight:700;color:var(--dark);margin-bottom:5px;}
  .rl-cta-copy{font-size:.84rem;color:var(--muted);line-height:1.6;}

  /* Detail panel — reuses the shared modal, just wider for reading. */
  .rl-modal .modal-card{max-width:620px;}
  .rl-modal .modal-step{padding:28px 26px 24px;}
  .rl-modal .dd-modal-eyebrow{color:#b83d5e;}
  .rl-modal .modal-close:focus-visible{outline:2.5px solid var(--pink);outline-offset:2px;}
  .rl-panel-intro{font-size:.84rem;color:var(--muted);line-height:1.6;margin:-6px 0 16px;}
  .rl-list{list-style:none;display:flex;flex-direction:column;gap:10px;}
  .rl-item{background:#fff;border-radius:14px;padding:14px 16px;border:1px solid var(--border);}
  .rl-item-title{font-weight:700;font-size:.92rem;color:var(--dark);}
  .rl-item-meta{font-size:.78rem;color:var(--muted);margin-top:2px;}
  .rl-item-body{font-size:.83rem;color:var(--text);line-height:1.6;margin-top:6px;}
  .rl-item-links{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;}
  .rl-link{font-size:.8rem;font-weight:700;color:#b83d5e;text-decoration:none;}
  .rl-link:hover{text-decoration:underline;}
  .rl-link:focus-visible{outline:2.5px solid var(--pink);outline-offset:2px;border-radius:4px;}
  .rl-soon{font-size:.76rem;font-weight:600;color:var(--muted);font-style:italic;}
  .rl-note{font-size:.76rem;color:var(--muted);line-height:1.55;margin-top:14px;}

  .rl-search{width:100%;padding:11px 14px;border-radius:12px;border:1.5px solid var(--border);background:#fff;font-family:var(--font-body);font-size:.88rem;color:var(--dark);margin-bottom:14px;}
  .rl-search:focus{outline:none;border-color:var(--pink);}
  .rl-group-title{font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#b83d5e;margin:16px 0 8px;}
  .rl-group-title:first-child{margin-top:0;}
  .rl-term{background:#fff;border-radius:12px;padding:11px 14px;border:1px solid var(--border);margin-bottom:8px;}
  .rl-term dt{font-weight:700;font-size:.88rem;color:var(--dark);}
  .rl-term dd{font-size:.82rem;color:var(--text);line-height:1.55;margin-top:3px;}

  .rl-faq{background:#fff;border-radius:14px;border:1px solid var(--border);}
  .rl-faq summary{cursor:pointer;list-style:none;padding:13px 16px;font-weight:700;font-size:.88rem;color:var(--dark);display:flex;justify-content:space-between;gap:10px;align-items:center;}
  .rl-faq summary::-webkit-details-marker{display:none;}
  .rl-faq summary::after{content:'+';color:var(--pink);font-size:1.1rem;font-weight:700;flex-shrink:0;}
  .rl-faq[open] summary::after{content:'–';}
  .rl-faq summary:focus-visible{outline:2.5px solid var(--pink);outline-offset:2px;border-radius:14px;}
  .rl-faq-body{padding:0 16px 14px;}
  .rl-faq-body p{font-size:.83rem;color:var(--text);line-height:1.6;}

  .rl-setup-row{display:flex;gap:12px;align-items:flex-start;}
  .rl-setup-ico{font-size:20px;line-height:1;margin-top:2px;flex-shrink:0;}

  .rl-plan-field{margin-bottom:12px;}
  .rl-plan-field label{display:block;font-weight:700;font-size:.85rem;color:var(--dark);margin-bottom:2px;}
  .rl-plan-hint{display:block;font-size:.75rem;color:var(--muted);margin-bottom:6px;}
  .rl-plan-field textarea{width:100%;padding:10px 12px;border-radius:12px;border:1.5px solid var(--border);background:#fff;font-family:var(--font-body);font-size:.86rem;color:var(--dark);resize:vertical;line-height:1.5;}
  .rl-plan-field textarea:focus{outline:none;border-color:var(--pink);}
  .rl-plan-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px;}
  .rl-plan-status{font-size:.76rem;color:#1a6b63;font-weight:600;min-height:1em;}

  @media(max-width:520px){
    .rl-cta{padding:20px;}
    .rl-cta .dd-primary-btn{width:100%;}
    .rl-modal{padding:10px;}
    .rl-modal .modal-step{padding:24px 18px 20px;}
  }
</style>
</head>
<body>

<script src="shared/auth-guard.js"></script>
<script src="shared/sidebar.js" data-active="resources"></script>

<main class="main">
  <header class="rl-head">
    <div class="pg-eye" id="rlEyebrow"></div>
    <div class="rl-title-row">
      <h1 class="pg-title" id="rlTitle"></h1>
      <span class="rl-free-badge" id="rlBadge"></span>
    </div>
    <p class="rl-sub" id="rlSub"></p>
  </header>

  <section aria-labelledby="rlTitle">
    <ul class="rl-grid" id="rlGrid"></ul>
  </section>

  <section class="rl-cta" aria-labelledby="rlCtaTitle">
    <div class="rl-cta-text">
      <h2 class="rl-cta-title" id="rlCtaTitle"></h2>
      <p class="rl-cta-copy" id="rlCtaCopy"></p>
    </div>
    <a class="dd-primary-btn" id="rlCtaBtn" href="lessons.html"></a>
  </section>
</main>

<div class="modal-overlay rl-modal" id="rlModal">
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="rlModalTitle">
    <button type="button" class="modal-close" id="rlModalClose" aria-label="Close">✕</button>
    <div class="modal-step visible">
      <div class="dd-modal-eyebrow" id="rlModalEyebrow"></div>
      <h2 class="dd-modal-title" id="rlModalTitle" tabindex="-1"></h2>
      <div id="rlModalBody"></div>
    </div>
  </div>
</div>

<script type="module">
  // Static page content has no dependency on the member's profile, so it
  // renders immediately; auth-guard.js keeps <body> hidden until the
  // session check passes, same as every other protected page.
  let data;
  try {
    data = await import('./shared/resource-library-data.js');
  } catch (err) {
    console.error('Resource Library failed to load:', err);
    document.querySelector('.main').innerHTML = `
      <div style="max-width:520px;margin:40px auto;padding:28px;background:#fff;border-radius:16px;border:1px solid #F1E7E1;text-align:center;">
        <div style="font-size:1.1rem;font-weight:700;color:#3D2B20;margin-bottom:8px;">Something went wrong loading the Resource Library</div>
        <div style="font-size:.88rem;color:#7A5C50;margin-bottom:18px;word-break:break-word;">${(err && err.message) ? err.message : 'An unexpected error occurred.'}</div>
        <button type="button" onclick="location.reload()" style="padding:10px 22px;border-radius:999px;border:none;background:#F4829A;color:#fff;font-weight:600;cursor:pointer;">Reload</button>
      </div>`;
    throw err;
  }

  const { RESOURCES, RESOURCE_LINKS, BOOKS, DICTIONARY, FAQ, SETUP_TOOLS, TRADING_PLAN_FIELDS, PAGE_COPY } = data;

  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  /** A link from RESOURCE_LINKS, or a "coming soon" label when it's still a placeholder. */
  function linkHtml({ key, label, external }) {
    const href = RESOURCE_LINKS[key];
    if (!href) return `<span class="rl-soon">${esc(label)} — link coming soon</span>`;
    const ext = external || /^https?:/.test(href);
    return `<a class="rl-link" href="${esc(href)}"${ext ? ' target="_blank" rel="noopener noreferrer"' : ''}>${esc(label)}${ext ? ' ↗<span class="visually-hidden"> (opens in a new tab)</span>' : ' →'}</a>`;
  }

  /* ── Header, grid, CTA ─────────────────────────────────────────── */
  document.getElementById('rlEyebrow').textContent = `✦ ${PAGE_COPY.eyebrow}`;
  document.getElementById('rlTitle').textContent = PAGE_COPY.title;
  document.getElementById('rlBadge').textContent = PAGE_COPY.badge;
  document.getElementById('rlSub').textContent = PAGE_COPY.subtitle;
  document.getElementById('rlCtaTitle').textContent = PAGE_COPY.ctaTitle;
  document.getElementById('rlCtaCopy').textContent = PAGE_COPY.ctaCopy;
  const ctaBtn = document.getElementById('rlCtaBtn');
  ctaBtn.textContent = `${PAGE_COPY.ctaButton} →`;
  ctaBtn.href = RESOURCE_LINKS.continueLearning;

  document.getElementById('rlGrid').innerHTML = RESOURCES.map((r) => {
    const href = r.linkKey ? RESOURCE_LINKS[r.linkKey] : null;
    const ext = href && /^https?:/.test(href);
    const action = href
      ? `<a class="dd-secondary-btn" href="${esc(href)}"${ext ? ' target="_blank" rel="noopener noreferrer"' : ''}>${esc(r.button)} →</a>`
      : `<button type="button" class="dd-secondary-btn" data-panel="${esc(r.panel)}" aria-haspopup="dialog">${esc(r.button)} →</button>`;
    return `
      <li class="dd-card rl-card rl-tone-${esc(r.tone)}" id="${esc(r.id)}">
        <div class="rl-card-top">
          <span class="rl-icon" aria-hidden="true">${r.icon}</span>
          ${r.format ? `<span class="rl-format">${esc(r.format)}</span>` : ''}
        </div>
        <div class="rl-cat">${esc(r.category)}</div>
        <h2 class="rl-card-title">${esc(r.title)}</h2>
        <p class="rl-card-desc">${esc(r.description)}</p>
        ${action}
      </li>`;
  }).join('');

  /* ── Panels ────────────────────────────────────────────────────── */
  const PANELS = {
    books: {
      render: () => `
        <p class="rl-panel-intro">Not required reading — just a couple of books worth having in your corner.</p>
        <ul class="rl-list">${BOOKS.map((b) => `
          <li class="rl-item">
            <div class="rl-item-title">${esc(b.title)}</div>
            <div class="rl-item-meta">by ${esc(b.author)}</div>
            <p class="rl-item-body">${esc(b.why)}</p>
            <div class="rl-item-links">${linkHtml({ key: b.linkKey, label: 'Get the book' })}</div>
          </li>`).join('')}
        </ul>
        <p class="rl-note">Links go to legitimate retailers or publishers — AGHF doesn’t host copies of these books.</p>`,
    },
    dictionary: {
      render: () => `
        <label class="visually-hidden" for="rlDictSearch">Search terms</label>
        <input type="search" class="rl-search" id="rlDictSearch" placeholder="Search a term… e.g. tick, liquidity" autocomplete="off">
        <div id="rlDictList">${DICTIONARY.map((g) => `
          <div class="rl-dict-group">
            <h3 class="rl-group-title">${esc(g.group)}</h3>
            <dl>${g.terms.map((t) => `
              <div class="rl-term" data-search="${esc(`${t.term} ${t.def}`.toLowerCase())}"><dt>${esc(t.term)}</dt><dd>${esc(t.def)}</dd></div>`).join('')}
            </dl>
          </div>`).join('')}
        </div>
        <p class="rl-note" id="rlDictEmpty" hidden>No match yet — try a shorter word, or ask in the Discord.</p>`,
      wire: (root) => {
        const input = root.querySelector('#rlDictSearch');
        input.addEventListener('input', () => {
          const q = input.value.trim().toLowerCase();
          let shown = 0;
          root.querySelectorAll('.rl-dict-group').forEach((g) => {
            let groupShown = 0;
            g.querySelectorAll('.rl-term').forEach((t) => {
              const match = !q || t.dataset.search.includes(q);
              t.hidden = !match;
              if (match) groupShown += 1;
            });
            g.hidden = groupShown === 0;
            shown += groupShown;
          });
          root.querySelector('#rlDictEmpty').hidden = shown > 0;
        });
      },
    },
    faq: {
      render: () => `
        <ul class="rl-list">${FAQ.map((f) => `
          <li><details class="rl-faq">
            <summary>${esc(f.q)}</summary>
            <div class="rl-faq-body">
              <p>${esc(f.a)}</p>
              ${f.links && f.links.length ? `<div class="rl-item-links">${f.links.map(linkHtml).join('')}</div>` : ''}
            </div>
          </details></li>`).join('')}
        </ul>`,
    },
    setup: {
      render: () => `
        <p class="rl-panel-intro">These point to lessons and pages already in the Academy, so you learn each tool once, in the right place.</p>
        <ul class="rl-list">${SETUP_TOOLS.map((s) => `
          <li class="rl-item rl-setup-row">
            <span class="rl-setup-ico" aria-hidden="true">${s.icon}</span>
            <div>
              <div class="rl-item-title">${esc(s.title)}</div>
              <p class="rl-item-body" style="margin-top:2px;">${esc(s.desc)}</p>
              <div class="rl-item-links">${s.links.map(linkHtml).join('')}</div>
            </div>
          </li>`).join('')}
        </ul>
        <p class="rl-note">Lessons open in order — if one isn’t unlocked yet, you’ll land back in the Academy at your next step.</p>`,
    },
    'trading-plan': {
      render: () => `
        <p class="rl-panel-intro">Keep it short and honest. A plan you’ll actually follow beats a perfect one you won’t. Saves automatically on this device.</p>
        <form id="rlPlanForm" novalidate>
          ${TRADING_PLAN_FIELDS.map((f) => `
            <div class="rl-plan-field">
              <label for="rlPlan-${esc(f.key)}">${esc(f.label)}</label>
              <span class="rl-plan-hint" id="rlPlanHint-${esc(f.key)}">${esc(f.hint)}</span>
              <textarea id="rlPlan-${esc(f.key)}" name="${esc(f.key)}" rows="${f.rows}" aria-describedby="rlPlanHint-${esc(f.key)}"></textarea>
            </div>`).join('')}
          <div class="rl-plan-actions">
            <button type="button" class="dd-primary-btn" id="rlPlanCopy">Copy my plan</button>
            <button type="button" class="dd-secondary-btn" id="rlPlanDownload">Download (.txt)</button>
            <span class="rl-plan-status" id="rlPlanStatus" role="status" aria-live="polite"></span>
          </div>
        </form>`,
      wire: (root) => wireTradingPlan(root),
    },
  };

  /* ── Trading plan (per-member draft in localStorage) ───────────── */
  function planStorageKey() {
    const uid = (window.AGHF_USER && window.AGHF_USER.id) || 'anon';
    return `aghf_trading_plan:${uid}`;
  }
  function loadPlan() {
    try { return JSON.parse(localStorage.getItem(planStorageKey()) || '{}') || {}; } catch (err) { return {}; }
  }
  function savePlan(plan) {
    try { localStorage.setItem(planStorageKey(), JSON.stringify(plan)); return true; } catch (err) { return false; }
  }
  function planAsText(plan) {
    const lines = ['MY TRADING PLAN — A Girl & Her Futures', ''];
    TRADING_PLAN_FIELDS.forEach((f) => {
      lines.push(f.label.toUpperCase());
      lines.push((plan[f.key] || '').trim() || '—');
      lines.push('');
    });
    return lines.join('\n');
  }
  function wireTradingPlan(root) {
    const form = root.querySelector('#rlPlanForm');
    const status = root.querySelector('#rlPlanStatus');
    const plan = loadPlan();
    TRADING_PLAN_FIELDS.forEach((f) => { form.elements[f.key].value = plan[f.key] || ''; });
    const read = () => Object.fromEntries(TRADING_PLAN_FIELDS.map((f) => [f.key, form.elements[f.key].value]));
    let t;
    form.addEventListener('input', () => {
      clearTimeout(t);
      t = setTimeout(() => { status.textContent = savePlan(read()) ? 'Saved ✓' : 'Couldn’t save on this device — copy or download it instead.'; }, 400);
    });
    root.querySelector('#rlPlanCopy').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(planAsText(read()));
        status.textContent = 'Copied to your clipboard ✓';
      } catch (err) {
        status.textContent = 'Couldn’t copy — try Download instead.';
      }
    });
    root.querySelector('#rlPlanDownload').addEventListener('click', () => {
      const blob = new Blob([planAsText(read())], { type: 'text/plain' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'my-trading-plan.txt';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      status.textContent = 'Downloaded ✓';
    });
  }

  /* ── Accessible modal controller ───────────────────────────────── */
  const modal = document.getElementById('rlModal');
  const modalBody = document.getElementById('rlModalBody');
  const modalTitle = document.getElementById('rlModalTitle');
  let lastTrigger = null;

  function openPanel(key, trigger) {
    const resource = RESOURCES.find((r) => r.panel === key);
    const panel = PANELS[key];
    if (!resource || !panel) return;
    lastTrigger = trigger || null;
    document.getElementById('rlModalEyebrow').textContent = resource.category;
    modalTitle.textContent = resource.title;
    modalBody.innerHTML = panel.render();
    if (panel.wire) panel.wire(modalBody);
    modal.classList.add('open');
    document.body.style.overflow = 'hidden';
    modal.querySelector('.modal-card').scrollTop = 0;
    modalTitle.focus();
    history.replaceState(null, '', `#${resource.id}`);
  }
  function closePanel() {
    if (!modal.classList.contains('open')) return;
    modal.classList.remove('open');
    document.body.style.overflow = '';
    history.replaceState(null, '', location.pathname + location.search);
    if (lastTrigger) lastTrigger.focus();
  }

  document.getElementById('rlGrid').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-panel]');
    if (btn) openPanel(btn.dataset.panel, btn);
  });
  document.getElementById('rlModalClose').addEventListener('click', closePanel);
  modal.addEventListener('click', (e) => { if (e.target === modal) closePanel(); });
  document.addEventListener('keydown', (e) => {
    if (!modal.classList.contains('open')) return;
    if (e.key === 'Escape') { closePanel(); return; }
    if (e.key !== 'Tab') return;
    // Keep keyboard focus inside the open panel.
    const focusables = [...modal.querySelectorAll('button, a[href], input, textarea, summary, [tabindex]:not([tabindex="-1"])')]
      .filter((el) => !el.hidden && el.offsetParent !== null);
    if (!focusables.length) return;
    const first = focusables[0];
    const last = focusables[focusables.length - 1];
    if (e.shiftKey && (document.activeElement === first || document.activeElement === modalTitle)) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });

  // Deep links (e.g. resources.html#dictionary) open that resource's panel
  // once auth has passed and the page is visible.
  function openFromHash() {
    const id = decodeURIComponent(location.hash.slice(1));
    const resource = RESOURCES.find((r) => r.id === id);
    if (!resource) return;
    const btn = document.querySelector(`#${CSS.escape(resource.id)} [data-panel]`);
    if (btn) openPanel(resource.panel, btn);
  }
  if (document.body.style.visibility === 'hidden') {
    document.addEventListener('aghf-auth-ready', openFromHash, { once: true });
  } else {
    openFromHash();
  }
</script>

</body>
</html>
