<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lesson Notes — A Girl & Her Futures</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,700;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/tokens.css">
<link rel="stylesheet" href="shared/sidebar.css">
<link rel="stylesheet" href="shared/components.css">
<link rel="stylesheet" href="shared/dayli-desk.css">
</head>
<body>

<script src="shared/auth-guard.js"></script>
<script src="shared/sidebar.js" data-active="playbook"></script>

<main class="main">
  <div class="dd-header-top">
    <div>
      <div class="pg-eye">❦ Saved from your lessons</div>
      <div class="pg-title">Lesson Notes</div>
    </div>
    <a class="dd-secondary-btn" href="psychology-playbook.html">Looking for your AGHF Agent Playbook? →</a>
  </div>
  <div id="ddPlaybookList"></div>
</main>

<script type="module">
  const el = document.getElementById('ddPlaybookList');

  (async function boot() {
    let getPlaybookCards;
    try {
      ({ getPlaybookCards } = await import('./shared/playbook-service.js'));
    } catch (err) {
      console.error('Playbook failed to load:', err);
      el.innerHTML = `
        <div style="max-width:520px;margin:40px auto;padding:28px;background:#fff;border-radius:16px;border:1px solid #F1E7E1;text-align:center;">
          <div style="font-size:1.1rem;font-weight:700;color:#3D2B20;margin-bottom:8px;">Something went wrong loading your playbook</div>
          <div style="font-size:.88rem;color:#7A5C50;margin-bottom:18px;word-break:break-word;">${(err && err.message) ? err.message : 'An unexpected error occurred.'}</div>
          <button type="button" onclick="location.reload()" style="padding:10px 22px;border-radius:999px;border:none;background:#F4829A;color:#fff;font-weight:600;cursor:pointer;">Reload</button>
        </div>`;
      return;
    }

    const cards = getPlaybookCards();
    if (!cards.length) {
      el.innerHTML = `<div class="dd-card dd-empty"><div class="dd-empty-icon">❦</div><div class="dd-empty-text">Nothing saved yet — finish a lesson and tap "Save to My Playbook" to build your reference set here.</div><a class="dd-primary-btn" href="lessons.html">Go to Academy</a></div>`;
    } else {
      el.innerHTML = `<div class="dd-playbook-grid">${cards.map((c) => {
        const [phase, n] = String(c.lessonId || '').split('-');
        const lessonHref = phase && n ? `lesson.html?phase=${encodeURIComponent(phase)}&n=${encodeURIComponent(n)}` : null;
        return `
        <div class="dd-playbook-card">
          <div class="dd-playbook-title">${c.title}</div>
          <ul class="dd-playbook-checklist">${(c.checklist || []).map((i) => `<li>${i}</li>`).join('')}</ul>
          ${c.remember ? `<div class="dd-playbook-remember">🎀 ${c.remember}</div>` : ''}
          ${lessonHref ? `<a class="dd-section-link" style="display:inline-block;margin-top:10px;" href="${lessonHref}">View This Lesson →</a>` : ''}
        </div>`;
      }).join('')}</div>`;
    }
  })();
</script>

</body>
</html>
