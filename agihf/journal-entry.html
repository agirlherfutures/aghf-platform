<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trade Journal Entry — A Girl & Her Futures</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,700;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/tokens.css">
<link rel="stylesheet" href="shared/sidebar.css">
<link rel="stylesheet" href="shared/components.css">
<link rel="stylesheet" href="shared/dayli-desk.css">
<link rel="stylesheet" href="shared/lesson-engine.css">
</head>
<body>

<script src="shared/auth-guard.js"></script>
<script src="shared/sidebar.js" data-active="journal"></script>

<main class="main">
  <div class="pg-eye">✦ AG&amp;HF Trade Log</div>
  <div class="pg-title" id="jePageTitle">New Trade</div>
  <div id="jeRoot"></div>
</main>

<script type="module">
  // Loaded dynamically rather than as static top-level imports — a failure
  // in any one of these (a bad path, a stale deployment missing a file, a
  // syntax error anywhere in their own import graph) would previously kill
  // this entire script before it ever ran, leaving #jeRoot permanently
  // empty with no error shown at all — the exact bug already fixed on this
  // page's sibling pages this session.
  let getEntry, saveEntry, deleteEntry, createAutosaver, renderJournalEntryPage, renderTradeCaseFile, entryToSummaryCardProps, renderTradeSummaryCard, hydrateTscShots, renderErrorState, renderSkeleton, showDeskToast, openModal, closeModal, burst, todayKey;

  const root = document.getElementById('jeRoot');
  const params = new URLSearchParams(window.location.search);
  const entryId = params.get('id');
  const prefillTradeDate = params.get('tradeDate');

  function renderFallbackError(err) {
    console.error('Journal entry page failed to load:', err);
    root.innerHTML = `
      <div style="max-width:520px;margin:40px auto;padding:28px;background:#fff;border-radius:16px;border:1px solid #F1E7E1;text-align:center;">
        <div style="font-size:1.1rem;font-weight:700;color:#3D2B20;margin-bottom:8px;">Something went wrong loading this journal entry</div>
        <div style="font-size:.88rem;color:#7A5C50;margin-bottom:18px;word-break:break-word;">${(err && err.message) ? err.message : 'An unexpected error occurred.'}</div>
        <button type="button" onclick="location.reload()" style="padding:10px 22px;border-radius:999px;border:none;background:#F4829A;color:#fff;font-weight:600;cursor:pointer;">Reload</button>
      </div>`;
  }

  async function apiFetch(path, opts = {}) {
    const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
    if (window.AGHF_SESSION_TOKEN) headers.Authorization = `Bearer ${window.AGHF_SESSION_TOKEN}`;
    const res = await fetch(path, { ...opts, headers });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.error || `Request failed (${res.status})`);
    return body;
  }

  function readAsDataUrl(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function uploadScreenshot(file, currentEntryId) {
    if (window.AGHF_DEMO) return `demo/${Date.now()}-${file.name}`;
    const dataUrl = await readAsDataUrl(file);
    const { path } = await apiFetch('/api/journal-screenshot', {
      method: 'POST', body: JSON.stringify({ dataUrl, filename: file.name, entryId: currentEntryId }),
    });
    return path;
  }

  function freshEntry() {
    return {
      entryType: 'trade', tradeDate: prefillTradeDate || todayKey(), direction: null,
      exits: [], methodQualityTags: [], ruleViolations: [], screenshots: [], emotions: {},
      entryTags: [], exitTags: [], lessons: [], iccChecklist: null, isDraft: true,
    };
  }

  async function boot() {
    try {
      ({ getEntry, saveEntry, deleteEntry, createAutosaver } = await import('./shared/journal-service.js'));
      ({ renderJournalEntryPage, renderTradeCaseFile, entryToSummaryCardProps, renderTradeSummaryCard, hydrateTscShots } = await import('./shared/journal-engine.js'));
      ({ renderErrorState, renderSkeleton, showDeskToast, openModal, closeModal } = await import('./shared/dayli-desk-engine.js'));
      ({ burst } = await import('./shared/lesson-engine.js'));
      ({ todayKey } = await import('./shared/dashboard-models.js'));
    } catch (err) {
      renderFallbackError(err);
      return;
    }

    renderSkeleton(root, 5);
    try {
      const entry = entryId ? await getEntry(entryId) : freshEntry();
      if (entryId && !entry) {
        root.innerHTML = `<div class="dd-card dd-empty"><div class="dd-empty-icon">🔍</div><div class="dd-empty-text">That journal entry couldn't be found.</div><a class="dd-primary-btn" href="journal.html">Back to Journal</a></div>`;
        return;
      }
      startPage(entry);
    } catch (err) {
      console.error('Journal entry load error:', err);
      renderErrorState(root, err.message || "Couldn't load this entry.", boot);
    }
  }

  function startPage(entry) {
    document.getElementById('jePageTitle').textContent = entry.tradeNumber ? `Trade #${entry.tradeNumber}` : entryId ? 'Edit Trade' : 'New Trade';

    if (entry.isDraft === false && entry.id) {
      renderTradeCaseFile(root, entry, { apiFetch, onEdit: () => startWizard(entry) });
      return;
    }
    startWizard(entry);
  }

  function startWizard(entry) {
    let handle;
    const autosave = createAutosaver((status, resultOrErr) => {
      if (status === 'saved') {
        // Check "is this the first-ever save" BEFORE merging — once merged,
        // entry.id is always present, so this is the one moment we can tell.
        const wasNew = !handle.getState().id;
        handle.applySavedFields(resultOrErr);
        handle.setSaveStatus('saved');
        if (wasNew && resultOrErr.id) {
          // First save of a brand-new entry — swap the URL so a refresh edits, not duplicates.
          window.history.replaceState({}, '', `journal-entry.html?id=${resultOrErr.id}`);
          document.getElementById('jePageTitle').textContent = resultOrErr.tradeNumber ? `Trade #${resultOrErr.tradeNumber}` : 'Edit Trade';
        }
      } else {
        handle.setSaveStatus(status);
      }
    });

    handle = renderJournalEntryPage(root, entry, {
      apiFetch,
      uploadScreenshot,
      onChange: (next) => autosave(next),
      onDelete: async () => {
        const current = handle.getState();
        if (!current.id) { window.location.href = 'journal.html'; return; }
        if (!confirm('Delete this journal entry? This can’t be undone.')) return;
        try {
          await deleteEntry(current.id);
          showDeskToast('Entry deleted');
          window.location.href = 'journal-history.html';
        } catch (err) {
          console.error('Delete entry error:', err);
          alert("Couldn't delete this entry — try again in a moment.");
        }
      },
      onSaveDraft: async () => {
        autosave.cancel();
        try {
          const saved = await saveEntry({ ...handle.getState(), isDraft: true });
          handle.applySavedFields(saved);
          showDeskToast('Saved as draft — pick up where you left off ✦');
          window.location.href = 'journal-history.html';
        } catch (err) {
          console.error('Save draft error:', err);
          alert("Couldn't save this draft — try again in a moment.");
        }
      },
      onSaveFinal: async () => {
        autosave.cancel();
        try {
          const saved = await saveEntry({ ...handle.getState(), isDraft: false });
          handle.applySavedFields(saved);
          if (saved.gpAwarded > 0) {
            burst();
            showDeskToast(`+${saved.gpAwarded} GP · Entry saved ✦`);
            // A real "Clean Execution" moment — followed the plan and won, or
            // exited/avoided per-rule rather than emotionally — is exactly
            // the kind of thing worth inviting a member to share, never a
            // requirement to do so.
            const isShareableWin = (saved.ruleCheck === 'yes' && saved.outcome === 'win')
              || (saved.exitTags || []).some((t) => ['Trade Invalidated', 'Rule-Based Exit'].includes(t));
            const body = openModal(renderTradeSummaryCard(entryToSummaryCardProps(saved), { variant: 'celebration' }) + `
              ${isShareableWin ? `<div style="margin-top:14px;text-align:center;"><a class="dd-secondary-btn" href="share-win-flow.html?fromJournalEntryId=${saved.id}">✦ Share This Win</a></div>` : ''}
              <div style="margin-top:16px;text-align:center;"><button type="button" class="dd-primary-btn" id="tscCloseBtn">Nice ✦</button></div>`);
            if (saved.screenshots?.length) hydrateTscShots(body, apiFetch);
            body.querySelector('#tscCloseBtn').addEventListener('click', () => {
              closeModal();
              window.location.href = 'journal-history.html';
            });
          } else {
            showDeskToast('Entry saved ✦');
            window.location.href = 'journal-history.html';
          }
        } catch (err) {
          console.error('Save final error:', err);
          alert("Couldn't save this entry — try again in a moment.");
        }
      },
    });
  }

  document.addEventListener('aghf-auth-ready', boot);
</script>

</body>
</html>
