<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lesson — A Girl & Her Futures</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,700;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/tokens.css">
<link rel="stylesheet" href="shared/sidebar.css">
<link rel="stylesheet" href="shared/lesson-engine.css">
</head>
<body>

<script src="shared/auth-guard.js"></script>
<script src="shared/sidebar.js" data-active="lessons"></script>

<main class="main">
  <div class="lw-top">
    <div class="lw-crumb" id="lwCrumb">Lessons</div>
    <div class="lw-top-right">
      <span class="lw-xp-pill" id="lwXp">+0 XP</span>
      <span class="lw-count" id="lwCount">1 / 1</span>
    </div>
  </div>
  <div class="lw-progress"><div class="lw-progress-fill" id="lwBar"></div></div>

  <div class="lw-wrap" id="lwWrap"></div>
</main>

<div class="lw-bottom">
  <div style="display:flex;align-items:center;gap:12px">
    <div class="lw-dots" id="lwDots"></div>
    <div class="lw-stepname" id="lwStepname"></div>
  </div>
  <div style="display:flex;gap:9px">
    <button type="button" class="lw-prev" id="lwPrev">← Back</button>
    <button type="button" class="lw-next" id="lwNext">Next →</button>
  </div>
</div>

<div class="lw-streak" id="lwStreak"><span id="lwStreakIcon">🔥</span><span id="lwStreakText"></span></div>
<div class="lw-toast" id="lwToast">
  <span>✦</span>
  <div>
    <div style="font-size:.85rem;font-weight:700" id="lwToastTitle"></div>
    <div style="font-size:.7rem;color:rgba(255,255,255,.5)" id="lwToastSub"></div>
  </div>
</div>

<script type="module">
  import { PHASES, phaseByKey } from './shared/curriculum-data.js';
  import { renderLessonWizard } from './shared/lesson-engine.js';

  const params = new URLSearchParams(window.location.search);
  const phaseKey = params.get('phase') || 'p1';
  const n = parseInt(params.get('n'), 10);
  const phase = phaseByKey(phaseKey);
  const allLessons = phase.sections.flatMap((s) => s.lessons.map((l) => ({ ...l, section: s })));
  const total = allLessons.length;
  const current = allLessons.find((l) => l.n === n);

  async function loadLesson() {
    let data;
    try {
      const res = await fetch(`lessons-data/${phaseKey}-${n}.json`);
      if (!res.ok) throw new Error('not found');
      data = await res.json();
    } catch (err) {
      document.getElementById('lwWrap').innerHTML = '<p style="padding:20px;color:var(--muted)">This lesson isn\'t available yet.</p>';
      return;
    }

    const nextLesson = n < total ? n + 1 : null;
    const nextHref = nextLesson ? `lesson.html?phase=${phaseKey}&n=${nextLesson}` : null;
    const backHref = nextLesson ? 'lessons.html' : 'dashboard.html';

    renderLessonWizard(data, {
      nextHref,
      backHref,
      onAward: async () => {
        if (window.AGHF_DEMO) return;
        try {
          const res = await fetch('/api/complete-lesson', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${window.AGHF_SESSION_TOKEN}` },
            body: JSON.stringify({ lessonId: `${phaseKey}-${n}`, gpEarned: data.xpValue }),
          });
          await res.json();
        } catch (err) {
          console.error('Complete lesson error:', err);
        }
      },
    });
  }

  document.addEventListener('aghf-auth-ready', loadLesson);
</script>

</body>
</html>
