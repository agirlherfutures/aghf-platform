<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Trader Desk — A Girl & Her Futures</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,700;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/tokens.css">
<link rel="stylesheet" href="shared/sidebar.css">
<link rel="stylesheet" href="shared/lesson-engine.css">
<link rel="stylesheet" href="shared/casefile.css">
<link rel="stylesheet" href="shared/p8-light.css">
<link rel="stylesheet" href="shared/desk.css">
<link rel="stylesheet" href="shared/strategy-lab.css">
<link rel="stylesheet" href="shared/capstone.css">
<link rel="stylesheet" href="shared/desk-walk.css">
<link rel="stylesheet" href="shared/desk-light.css">
</head>
<body class="p8-on">
<script src="shared/auth-guard.js"></script>
<script src="shared/sidebar.js" data-active="desk"></script>
<main class="main dk-light">
  <div class="dt-top">
    <nav class="dt-rooms" id="dtRooms" aria-label="My Trader Desk"></nav>
    <div id="dtSwitch"></div>
  </div>
  <nav class="dt-sub" id="dtSub" aria-label="Section"></nav>
  <div id="dkView"></div>
</main>
<script type="module">
  import { TOOLS, renderStudyConfig, renderPracticeLab } from './shared/desk.js';
  import { studies, study } from './shared/desk-core.js';
  import { renderToday, renderPracticePicker, runPracticeDay, strategySwitch, setStrategy } from './shared/desk-today.js';
  import { UNLOCK_ALL } from './shared/preview.js';

  /*
   * Four rooms instead of ten tabs. Routes are #room or #room/sub.
   * Old links (desk.html#plan, #weekly, #backtest …) still land in the right place.
   */
  const ROOMS = [
    { k: 'today', label: 'Today' },
    { k: 'practice', label: 'Practice', subs: [['', 'Choose'], ['day', 'Top-down day'], ['replay', 'Replay reps'], ['backtest', 'Backtest study']] },
    { k: 'journal', label: 'Journal', subs: [['', 'Entries'], ['screenshots', 'Screenshots']] },
    { k: 'review', label: 'Review', subs: [['weekly', 'Weekly'], ['monthly', 'Monthly'], ['performance', 'Performance'], ['diagnostic', 'Strategy or me?'], ['plan', 'My Trading Plan']] },
  ];
  const LEGACY = { home: 'today', backtest: 'practice/backtest', screenshots: 'journal/screenshots', performance: 'review/performance', weekly: 'review/weekly', monthly: 'review/monthly', diagnostic: 'review/diagnostic', plan: 'review/plan', replay: 'practice/replay', review: 'review/weekly' };
  const view = document.getElementById('dkView');
  let name = '';
  let sdUnlocked = UNLOCK_ALL;

  function route() {
    let h = (location.hash || '#today').slice(1);
    if (LEGACY[h]) h = LEGACY[h];
    const [room, sub = ''] = h.split('/');
    const r = ROOMS.find((x) => x.k === room) || ROOMS[0];
    return { r, sub: r.subs && !r.subs.some(([k]) => k === sub) ? r.subs[0][0] : sub };
  }

  function show() {
    const { r, sub } = route();
    document.getElementById('dtRooms').innerHTML = ROOMS.map((x) => `<a href="#${x.k}" class="${x.k === r.k ? 'on' : ''}">${x.label}</a>`).join('');
    document.getElementById('dtSub').innerHTML = r.subs ? r.subs.map(([k, l]) => `<a href="#${r.k}${k ? `/${k}` : ''}" class="${k === sub ? 'on' : ''}">${l}</a>`).join('') : '';
    document.getElementById('dtSub').hidden = !r.subs;
    const sw = document.getElementById('dtSwitch');
    sw.innerHTML = r.k === 'today' || r.k === 'practice' ? strategySwitch(sdUnlocked) : '';
    sw.querySelectorAll('[data-strat]').forEach((b) => b.addEventListener('click', () => {
      if (b.dataset.strat === 'sd' && !sdUnlocked) return;
      setStrategy(b.dataset.strat); show();
    }));
    view.innerHTML = '';
    const host = document.createElement('div'); view.appendChild(host);
    if (r.k === 'today') return renderToday(host, { name, sdUnlocked });
    if (r.k === 'practice') {
      if (sub === 'day') return runPracticeDay(host);
      if (sub === 'replay') return renderPracticeLab(host, { reps: 10, title: 'REPLAY REPS' });
      if (sub === 'backtest') return backtest(host);
      return renderPracticePicker(host, { sdUnlocked });
    }
    if (r.k === 'journal') return (sub === 'screenshots' ? TOOLS.screenshots : TOOLS.journal)(host, { name });
    return (TOOLS[sub] || TOOLS.weekly)(host, { name });
  }

  function backtest(host) {
    const list = studies();
    host.innerHTML = `<div class="dk-review"><div class="dk-head"><div><div class="p8-kicker">BACKTEST STUDY</div><h3 class="p8-h">Your studies</h3><p class="dt-lede">Lock one set of rules, then run reps without Dayli’s answers.</p></div><button type="button" class="dt-btn" id="dkNew">+ New study</button></div>
      <div class="dk-studies">${list.map((s) => `<div class="dk-card" data-id="${s.studyId}"><b>${s.title} v${s.version}</b><span>${s.status} · ${s.completedRepCount}/${s.targetRepCount} reps${s.kind === 'RESEARCH' ? ' · research' : ''}</span></div>`).join('') || '<div class="dk-empty">No studies yet. Press “+ New study”, define the rules, lock them, then run reps.</div>'}</div><div id="dkStudy"></div></div>`;
    const box = host.querySelector('#dkStudy');
    const open = (id) => {
      box.innerHTML = '<div id="dkCfg"></div><div id="dkRun"></div>';
      const s = renderStudyConfig(box.querySelector('#dkCfg'), { studyId: id, onLocked: () => backtest(host) });
      if (s.status !== 'DRAFT') {
        const b = document.createElement('button'); b.className = 'dt-btn'; b.textContent = 'Run reps in this study →';
        b.addEventListener('click', () => renderPracticeLab(box.querySelector('#dkRun'), { study: study(s.studyId), reps: Math.max(1, s.targetRepCount - s.completedRepCount), title: s.title }));
        box.querySelector('#dkRun').appendChild(b);
      }
    };
    host.querySelector('#dkNew').addEventListener('click', () => open(null));
    host.querySelectorAll('.dk-studies .dk-card').forEach((c) => c.addEventListener('click', () => open(c.dataset.id)));
  }

  window.addEventListener('hashchange', () => { show(); window.scrollTo({ top: 0 }); });
  async function boot() {
    try {
      const p = await window.AGHF_FETCH_PROFILE?.();
      const pr = p?.profile || p || {};
      name = (pr.display_name || pr.first_name || pr.full_name || pr.name || '').split(' ')[0];
      if (!sdUnlocked) {
        const { PHASES } = await import('./shared/curriculum-data.js');
        const { phase5Complete } = await import('./shared/sd-progress.js');
        sdUnlocked = phase5Complete(new Set((p?.lessons_completed || []).map((l) => l.lesson_id)), PHASES);
      }
    } catch { /* no profile */ }
    try { show(); } finally { window.AGHF_HIDE_LOADER?.(); }
  }
  if (window.AGHF_USER) boot(); else document.addEventListener('aghf-auth-ready', boot, { once: true });
</script>
</body>
</html>
