<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Performance — A Girl & Her Futures</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,700;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/tokens.css">
<link rel="stylesheet" href="shared/sidebar.css">
<link rel="stylesheet" href="shared/components.css">
<link rel="stylesheet" href="shared/dayli-desk.css">
</head>
<body>

<script src="shared/auth-guard.js"></script>
<script src="shared/sidebar.js" data-active="performance"></script>

<main class="main">
  <div class="pg-eye">◔ How you're actually doing</div>
  <div class="pg-title">Performance</div>

  <div class="dd-section">
    <div class="dd-section-head"><div class="dd-section-title">Today's Consistency</div></div>
    <div class="dd-card" id="ddConsistencyFull"></div>
  </div>

  <div class="dd-section">
    <div class="dd-section-head"><div class="dd-section-title">Your Journey</div></div>
    <div class="dd-card" id="ddJourneyFull"></div>
  </div>

  <div class="dd-soon-card">
    <div class="dd-soon-title">Deeper trend analytics coming soon</div>
    <div class="dd-soon-sub">Win-rate trends, consistency-over-time charts, and method-adherence breakdowns by week/month will live here once enough trades and journal entries have been logged.</div>
  </div>
</main>

<script type="module">
  let PHASES;
  let listEntries;
  let listChecklists;
  let computeConsistencyScore;
  let renderConsistencyScore, renderJourneySummary, renderErrorState;

  function renderFallbackError(err) {
    console.error('Performance page failed to load:', err);
    document.querySelector('.main').innerHTML = `
      <div style="max-width:520px;margin:40px auto;padding:28px;background:#fff;border-radius:16px;border:1px solid #F1E7E1;text-align:center;">
        <div style="font-size:1.1rem;font-weight:700;color:#3D2B20;margin-bottom:8px;">Something went wrong loading your performance</div>
        <div style="font-size:.88rem;color:#7A5C50;margin-bottom:18px;word-break:break-word;">${(err && err.message) ? err.message : 'An unexpected error occurred.'}</div>
        <button type="button" onclick="location.reload()" style="padding:10px 22px;border-radius:999px;border:none;background:#F4829A;color:#fff;font-weight:600;cursor:pointer;">Reload</button>
      </div>`;
  }

  async function loadConsistency() {
    const el = document.getElementById('ddConsistencyFull');
    try {
      renderConsistencyScore(el, await computeConsistencyScore());
    } catch (err) {
      console.error('Consistency score load error:', err);
      renderErrorState(el, "Couldn't load your consistency score.", loadConsistency);
    }
  }

  async function loadJourney() {
    let profile = {};
    let completedIds = new Set();
    try {
      const data = await window.AGHF_FETCH_PROFILE();
      profile = data.profile || {};
      completedIds = new Set((data.lessons_completed || []).map((l) => l.lesson_id));
    } catch (err) { console.error('Profile load error:', err); }

    const p1 = PHASES[0];
    const allP1Lessons = p1.sections.flatMap((s) => s.lessons);
    const doneCount = allP1Lessons.filter((l) => l.n && completedIds.has(`p1-${l.n}`)).length;
    const [checklists, { total: journalCount }, { total: tradesJournaled }] = await Promise.all([
      listChecklists(200).catch(() => []),
      listEntries({ limit: 1 }).catch(() => ({ total: 0 })),
      listEntries({ entryType: 'trade', limit: 1 }).catch(() => ({ total: 0 })),
    ]);
    const checklistsCompleted = checklists.filter((c) => c.completedAt).length;

    renderJourneySummary(document.getElementById('ddJourneyFull'), [
      { value: doneCount, label: 'Lessons Completed' },
      { value: checklistsCompleted, label: 'Checklists Completed' },
      { value: journalCount, label: 'Journal Entries' },
      { value: `${profile.level || 1} · ${profile.gp || 0}GP`, label: 'Level & GP' },
      { value: p1.title, label: 'Current Phase' },
      { value: tradesJournaled, label: 'Trades Journaled' },
    ]);
  }

  document.addEventListener('aghf-auth-ready', boot);

  async function boot() {
    try {
      ({ PHASES } = await import('./shared/curriculum-data.js'));
      ({ listEntries } = await import('./shared/journal-service.js'));
      ({ listChecklists } = await import('./shared/checklist-service.js'));
      ({ computeConsistencyScore } = await import('./shared/consistency-service.js'));
      ({ renderConsistencyScore, renderJourneySummary, renderErrorState } = await import('./shared/dayli-desk-engine.js'));
    } catch (err) {
      renderFallbackError(err);
      return;
    }
    loadConsistency();
    loadJourney();
  }
</script>

</body>
</html>
