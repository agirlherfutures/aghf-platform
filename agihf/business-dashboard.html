<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business Dashboard — A Girl & Her Futures</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,700;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/tokens.css">
<link rel="stylesheet" href="shared/sidebar.css">
<link rel="stylesheet" href="shared/components.css">
<link rel="stylesheet" href="shared/dayli-desk.css">
<link rel="stylesheet" href="shared/business-dashboard.css">
</head>
<body class="biz-page">

<script src="shared/auth-guard.js"></script>
<script src="shared/sidebar.js" data-active="business-dashboard"></script>

<main class="main">
  <div class="pg-eye">✦ Admin</div>
  <div class="pg-title">Business Dashboard</div>
  <div class="small-help" style="margin:-8px 0 18px;">Members and revenue pulled from Whop. Only visible to AGHF administrators — every request here is re-checked on the server, this page's own gate is a convenience, not the real one.</div>
  <div id="bizRoot"></div>
</main>

<script type="module">
  import { getDashboardStats, triggerSync } from './shared/business-dashboard-service.js';

  const root = document.getElementById('bizRoot');

  const EVENT_LABELS = {
    joined: 'New member', renewed: 'Renewed', reactivated: 'Reactivated',
    cancelled: 'Cancelled', expired: 'Expired',
    payment_succeeded: 'Payment', payment_failed: 'Payment failed',
  };
  const GOOD_EVENTS = new Set(['joined', 'renewed', 'reactivated', 'payment_succeeded']);

  function money(n) {
    return (n < 0 ? '-$' : '$') + Math.abs(Number(n) || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function relTime(iso) {
    const diffMs = Date.now() - new Date(iso).getTime();
    const mins = Math.round(diffMs / 60000);
    if (mins < 1) return 'just now';
    if (mins < 60) return `${mins}m ago`;
    const hrs = Math.round(mins / 60);
    if (hrs < 24) return `${hrs}h ago`;
    const days = Math.round(hrs / 24);
    if (days < 30) return `${days}d ago`;
    return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  }

  function renderError(err) {
    if (err?.setupRequired) {
      root.innerHTML = `
        <div class="biz-setup-note">
          <strong>Not set up yet.</strong> ${err.message}
        </div>`;
      return;
    }
    root.innerHTML = `
      <div style="max-width:520px;margin:40px auto;padding:28px;background:#fff;border-radius:16px;border:1px solid #F1E7E1;text-align:center;">
        <div style="font-size:1.1rem;font-weight:700;color:#3D2B20;margin-bottom:8px;">Something went wrong loading the dashboard</div>
        <div style="font-size:.88rem;color:#7A5C50;margin-bottom:18px;word-break:break-word;">${(err && err.message) ? err.message : 'An unexpected error occurred.'}</div>
        <button type="button" onclick="location.reload()" style="padding:10px 22px;border-radius:999px;border:none;background:#F4829A;color:#fff;font-weight:600;cursor:pointer;">Reload</button>
      </div>`;
  }

  function renderNotAuthorized() {
    root.innerHTML = `
      <div style="max-width:480px;margin:40px auto;padding:28px;background:#fff;border-radius:16px;border:1px solid #F1E7E1;text-align:center;">
        <div style="font-size:1.1rem;font-weight:700;color:#3D2B20;margin-bottom:8px;">Not authorized</div>
        <div style="font-size:.88rem;color:#7A5C50;">This page is for AGHF administrators only.</div>
      </div>`;
  }

  function kpiTile(label, value, subText, subClass) {
    return `<div class="biz-kpi">
      <div class="biz-kpi-label">${label}</div>
      <div class="biz-kpi-value">${value}</div>
      ${subText ? `<div class="biz-kpi-sub${subClass ? ' ' + subClass : ''}">${subText}</div>` : ''}
    </div>`;
  }

  function renderChart(dailyRevenue) {
    const w = 760, h = 200, padL = 36, padB = 20, padT = 10;
    const max = Math.max(1, ...dailyRevenue.map((d) => d.amount));
    const barGap = 2;
    const barW = (w - padL) / dailyRevenue.length - barGap;
    const gridLines = [0, 0.25, 0.5, 0.75, 1].map((f) => {
      const y = padT + (h - padT - padB) * (1 - f);
      return `<line class="biz-gridline" x1="${padL}" y1="${y}" x2="${w}" y2="${y}"></line>
        <text class="biz-axis-label" x="0" y="${y + 3}">${money(max * f).replace('.00', '')}</text>`;
    }).join('');
    const bars = dailyRevenue.map((d, i) => {
      const barH = (h - padT - padB) * (d.amount / max);
      const x = padL + i * (barW + barGap);
      const y = h - padB - barH;
      const label = new Date(d.date + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      return `<rect class="biz-bar" data-date="${label}" data-amount="${d.amount}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${Math.max(1, barW).toFixed(1)}" height="${Math.max(0, barH).toFixed(1)}" rx="2"></rect>`;
    }).join('');
    const xLabels = dailyRevenue.filter((_, i) => i % 5 === 0).map((d, idx0, arr) => {
      const i = dailyRevenue.indexOf(d);
      const x = padL + i * (barW + barGap);
      const label = new Date(d.date + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      return `<text class="biz-axis-label" x="${x.toFixed(1)}" y="${h}">${label}</text>`;
    }).join('');
    return `<div class="biz-chart-wrap">
      <svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" role="img" aria-label="Daily revenue, last 30 days">
        ${gridLines}
        ${bars}
        ${xLabels}
      </svg>
      <div class="biz-tooltip" id="bizTooltip"></div>
    </div>`;
  }

  function wireChartHover(container) {
    const tooltip = container.querySelector('#bizTooltip');
    container.querySelectorAll('.biz-bar').forEach((bar) => {
      bar.addEventListener('mousemove', (e) => {
        const rect = container.querySelector('svg').getBoundingClientRect();
        tooltip.textContent = `${bar.dataset.date} — ${money(Number(bar.dataset.amount))}`;
        tooltip.style.left = `${e.clientX - rect.left}px`;
        tooltip.style.top = `${e.clientY - rect.top}px`;
        tooltip.classList.add('show');
      });
      bar.addEventListener('mouseleave', () => tooltip.classList.remove('show'));
    });
  }

  function renderEventsTable(events) {
    if (!events.length) {
      return `<div class="biz-empty-state">No member activity recorded yet. Once your Whop webhook is connected, joins, renewals, cancellations and payments will show up here in real time.</div>`;
    }
    const rows = events.map((e) => {
      const good = GOOD_EVENTS.has(e.event_type);
      return `<tr>
        <td><span class="biz-event-dot ${good ? 'good' : 'critical'}"></span><span class="biz-event-label">${EVENT_LABELS[e.event_type] || e.event_type}</span></td>
        <td>${e.email || e.membership_id || '—'}</td>
        <td>${e.amount != null ? `<span class="biz-event-amount">${money(e.amount)}</span>` : '—'}</td>
        <td>${relTime(e.occurred_at)}</td>
      </tr>`;
    }).join('');
    return `<table class="biz-events-table">
      <thead><tr><th>Event</th><th>Member</th><th>Amount</th><th>When</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
  }

  function render(stats, { syncing } = {}) {
    const s = stats;
    root.innerHTML = `
      ${!s.recentEvents.length && !s.activeMembers ? `<div class="biz-setup-note">
        <strong>No Whop data yet.</strong> Connect your Whop webhook to <code>/api/whop-webhook</code> and set <code>WHOP_API_KEY</code> / <code>WHOP_WEBHOOK_SECRET</code> to start tracking members and revenue. Then run a first <em>Sync now</em> below to backfill existing members.
      </div>` : ''}

      <div class="biz-header-row">
        <div></div>
        <div style="text-align:right;">
          <button type="button" class="biz-sync-btn" id="bizSyncBtn" ${syncing ? 'disabled' : ''}>${syncing ? 'Syncing…' : 'Sync now'}</button>
          <div class="biz-sync-meta">${s.lastSync?.last_synced_at
            ? `Last synced ${relTime(s.lastSync.last_synced_at)}${s.lastSync.last_sync_status === 'error' ? ` — error: ${s.lastSync.last_sync_error}` : ''}`
            : 'Never synced'}</div>
        </div>
      </div>

      <div class="biz-kpi-grid">
        ${kpiTile('Active Members', s.activeMembers.toLocaleString())}
        ${kpiTile('New This Week', '+' + s.members.newThisWeek, `${s.members.churnedThisWeek} churned`, s.members.netThisWeek >= 0 ? 'pos' : 'neg')}
        ${kpiTile('Net This Month', (s.members.netThisMonth >= 0 ? '+' : '') + s.members.netThisMonth, `${s.members.newThisMonth} new / ${s.members.churnedThisMonth} churned`)}
        ${kpiTile('Revenue Today', money(s.revenue.today))}
        ${kpiTile('Revenue This Week', money(s.revenue.thisWeek))}
        ${kpiTile('Revenue This Month', money(s.revenue.thisMonth))}
        ${kpiTile('Est. Run Rate', money(s.revenue.estMonthlyRunRate), 'trailing 30-day revenue')}
      </div>

      <div class="biz-card">
        <div class="biz-card-title">Daily Revenue — Last 30 Days</div>
        ${renderChart(s.dailyRevenue)}
      </div>

      <div class="biz-card">
        <div class="biz-card-title">Recent Activity</div>
        ${renderEventsTable(s.recentEvents)}
      </div>
    `;
    wireChartHover(root.querySelector('.biz-chart-wrap'));
    root.querySelector('#bizSyncBtn').addEventListener('click', onSync);
  }

  async function onSync() {
    try {
      render(currentStats, { syncing: true });
      await triggerSync();
      currentStats = await getDashboardStats();
      render(currentStats);
    } catch (err) {
      console.error('Sync error:', err);
      alert(`Sync failed: ${err.message}`);
      render(currentStats);
    }
  }

  let currentStats = null;

  const DEMO_STATS = {
    activeMembers: 128,
    revenue: { today: 240, thisWeek: 1180, thisMonth: 4820, estMonthlyRunRate: 5100 },
    members: { newThisWeek: 6, churnedThisWeek: 2, newThisMonth: 21, churnedThisMonth: 9, netThisWeek: 4, netThisMonth: 12 },
    dailyRevenue: Array.from({ length: 30 }, (_, i) => {
      const d = new Date(); d.setDate(d.getDate() - (29 - i));
      return { date: d.toISOString().slice(0, 10), amount: Math.round(80 + Math.random() * 220) };
    }),
    recentEvents: [
      { event_type: 'joined', email: 'demo.member@preview.local', amount: null, occurred_at: new Date(Date.now() - 30 * 60000).toISOString() },
      { event_type: 'payment_succeeded', email: 'demo.member@preview.local', amount: 39, occurred_at: new Date(Date.now() - 45 * 60000).toISOString() },
      { event_type: 'cancelled', email: 'another.demo@preview.local', amount: null, occurred_at: new Date(Date.now() - 4 * 3600000).toISOString() },
    ],
    lastSync: { last_synced_at: new Date(Date.now() - 2 * 3600000).toISOString(), last_sync_status: 'success' },
  };

  async function boot() {
    try {
      if (window.AGHF_DEMO) {
        currentStats = DEMO_STATS;
        render(currentStats);
        return;
      }
      const { profile } = await window.AGHF_FETCH_PROFILE();
      if (!profile?.is_admin) { renderNotAuthorized(); return; }
      currentStats = await getDashboardStats();
      render(currentStats);
    } catch (err) {
      console.error('Business dashboard load error:', err);
      renderError(err);
    }
  }

  document.addEventListener('aghf-auth-ready', boot);
</script>

</body>
</html>
