<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Journal — A Girl & Her Futures</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,700;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/tokens.css">
<link rel="stylesheet" href="shared/sidebar.css">
<link rel="stylesheet" href="shared/components.css">
<link rel="stylesheet" href="shared/dayli-desk.css">
</head>
<body>

<script src="shared/auth-guard.js"></script>
<script src="shared/sidebar.js" data-active="journal"></script>

<main class="main">
  <div class="pg-eye">✦ AG&amp;HF Trade Log</div>
  <div class="pg-title">Journal</div>

  <div class="dd-card" style="margin-bottom:16px;">
    <div class="dd-journal-actions">
      <a class="dd-secondary-btn" href="journal-entry.html">📊 Log a Trade</a>
      <button type="button" class="dd-secondary-btn" id="ddNewPre">📝 Pre-Market Reflection</button>
      <button type="button" class="dd-secondary-btn" id="ddNewPost">🌙 Post-Market Reflection</button>
    </div>
  </div>

  <div class="dd-snapshot-stats" style="margin-bottom:16px;" id="jhStats"></div>

  <div id="jhCalCard" style="margin-bottom:16px;"></div>

  <div class="dd-section-head">
    <div class="dd-section-title">Recent Entries</div>
    <a class="dd-section-link" href="journal-history.html">View Journal History →</a>
  </div>
  <div class="dd-card" id="jhRecent"></div>

  <div id="jhDrawerRoot"></div>
</main>

<script type="module">
  let getTodaysSnapshot, getRecentEntries, saveReflection, QUICK_JOURNAL_PROMPTS;
  let openJournalModal, renderRecentTrades, renderSkeleton, renderErrorState;
  let listEntries, listChecklists, listEvalPlans, hydrateTscShots;
  let groupEntriesByDay, groupChecklistsByDay, computeDayAggregate, computeMonthGrid;
  let renderCalendarView, renderTradeDayDrawer, closeTradeDayDrawer;

  function renderFallbackError(err) {
    console.error('Journal hub failed to load:', err);
    document.querySelector('.main').innerHTML = `
      <div style="max-width:520px;margin:40px auto;padding:28px;background:#fff;border-radius:16px;border:1px solid #F1E7E1;text-align:center;">
        <div style="font-size:1.1rem;font-weight:700;color:#3D2B20;margin-bottom:8px;">Something went wrong loading your journal</div>
        <div style="font-size:.88rem;color:#7A5C50;margin-bottom:18px;word-break:break-word;">${(err && err.message) ? err.message : 'An unexpected error occurred.'}</div>
        <button type="button" onclick="location.reload()" style="padding:10px 22px;border-radius:999px;border:none;background:#F4829A;color:#fff;font-weight:600;cursor:pointer;">Reload</button>
      </div>`;
  }

  async function load() {
    const statsEl = document.getElementById('jhStats');
    const recentEl = document.getElementById('jhRecent');
    renderSkeleton(statsEl, 1);
    renderSkeleton(recentEl, 2);
    try {
      const [snapshot, recent] = await Promise.all([getTodaysSnapshot(), getRecentEntries(3)]);
      const pnlClass = snapshot.netPnl > 0 ? 'dd-pnl-pos' : snapshot.netPnl < 0 ? 'dd-pnl-neg' : 'dd-pnl-flat';
      statsEl.innerHTML = `
        <div class="dd-mini-stat"><div class="dd-mini-stat-l">Trades Today</div><div class="dd-mini-stat-v">${snapshot.tradeCount}</div></div>
        <div class="dd-mini-stat"><div class="dd-mini-stat-l">Net P&amp;L Today</div><div class="dd-mini-stat-v ${pnlClass}">${snapshot.tradeCount ? (snapshot.netPnl > 0 ? '+' : snapshot.netPnl < 0 ? '−' : '') + '$' + Math.abs(Math.round(snapshot.netPnl)) : '—'}</div></div>
        <div class="dd-mini-stat"><div class="dd-mini-stat-l">Win Rate</div><div class="dd-mini-stat-v">${snapshot.winRate != null ? snapshot.winRate + '%' : '—'}</div></div>
        <div class="dd-mini-stat"><div class="dd-mini-stat-l">Most Recent</div><div class="dd-mini-stat-v" style="font-size:.85rem;">${recent[0] ? recent[0].tradeDate : 'None yet'}</div></div>`;
      renderRecentTrades(recentEl, recent, { tradeTrackerHref: 'journal-entry.html' });
    } catch (err) {
      console.error('Journal hub load error:', err);
      renderErrorState(recentEl, err.message || "Couldn't load your journal.", load);
    }
  }

  document.addEventListener('aghf-auth-ready', boot);

  async function boot() {
    try {
      ({ getTodaysSnapshot, getRecentEntries, saveReflection, QUICK_JOURNAL_PROMPTS, listEntries } = await import('./shared/journal-service.js'));
      ({ openJournalModal, renderRecentTrades, renderSkeleton, renderErrorState } = await import('./shared/dayli-desk-engine.js'));
      ({ listChecklists } = await import('./shared/checklist-service.js'));
      ({ listEvalPlans } = await import('./shared/eval-service.js'));
      ({ hydrateTscShots } = await import('./shared/journal-engine.js'));
      ({ groupEntriesByDay, groupChecklistsByDay, computeDayAggregate, computeMonthGrid } = await import('./shared/journal-calendar-math.js'));
      ({ renderCalendarView, renderTradeDayDrawer, closeTradeDayDrawer } = await import('./shared/journal-calendar-engine.js'));
    } catch (err) {
      renderFallbackError(err);
      return;
    }

    document.getElementById('ddNewPre').addEventListener('click', () => {
      const p = QUICK_JOURNAL_PROMPTS.premarket[Math.floor(Math.random() * QUICK_JOURNAL_PROMPTS.premarket.length)];
      openJournalModal('premarket', p, async (entry) => { await saveReflection('premarket_reflection', entry.prompt, entry.text); load(); });
    });
    document.getElementById('ddNewPost').addEventListener('click', () => {
      const p = QUICK_JOURNAL_PROMPTS.postmarket[Math.floor(Math.random() * QUICK_JOURNAL_PROMPTS.postmarket.length)];
      openJournalModal('postmarket', p, async (entry) => { await saveReflection('postmarket_reflection', entry.prompt, entry.text); load(); });
    });

    load();
    paintCalCard(); // independent — a slower fetch (500 entries/checklists/plans) shouldn't hold up the rest of the hub
  }

  /* ── Compact current-month calendar, above Recent Entries ──────────
   * Reuses the exact same aggregation/render functions as journal-history.html's
   * full Calendar view — no account/instrument filters or eval-plan strip here,
   * just a quick-glance month grid; "View Journal History" is still the way to
   * reach the full filterable version. */
  const today = new Date();
  let calYear = today.getFullYear();
  let calMonth = today.getMonth();
  let calAllEntries = null;
  let calAllChecklists = null;
  let calActivePlan = null;

  async function apiFetch(path, opts = {}) {
    const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
    if (window.AGHF_SESSION_TOKEN) headers.Authorization = `Bearer ${window.AGHF_SESSION_TOKEN}`;
    const res = await fetch(path, { ...opts, headers });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.error || `Request failed (${res.status})`);
    return body;
  }

  async function ensureCalData() {
    if (calAllEntries && calAllChecklists) return;
    const [{ entries }, checklists, plans] = await Promise.all([
      listEntries({ entryType: 'trade', limit: 500 }),
      listChecklists(500),
      listEvalPlans().catch(() => []),
    ]);
    calAllEntries = entries;
    calAllChecklists = checklists;
    calActivePlan = plans.find((p) => p.isActive) || null;
  }

  function monthAggregates(year, month) {
    const byDay = groupEntriesByDay(calAllEntries);
    const checklistsByDay = groupChecklistsByDay(calAllChecklists);
    const prefix = `${year}-${String(month + 1).padStart(2, '0')}`;
    const aggregatesByDate = new Map();
    for (const [date, trades] of byDay.entries()) {
      if (!date.startsWith(prefix)) continue;
      aggregatesByDate.set(date, computeDayAggregate(date, trades, checklistsByDay.get(date) || []));
    }
    for (const [date, checklistsForDay] of checklistsByDay.entries()) {
      if (!date.startsWith(prefix) || aggregatesByDate.has(date)) continue;
      aggregatesByDate.set(date, computeDayAggregate(date, [], checklistsForDay));
    }
    return aggregatesByDate;
  }

  async function paintCalCard() {
    const calEl = document.getElementById('jhCalCard');
    renderSkeleton(calEl, 1);
    try {
      await ensureCalData();
      const aggregatesByDate = monthAggregates(calYear, calMonth);
      const grid = computeMonthGrid(calYear, calMonth, aggregatesByDate);
      const monthLabel = new Date(calYear, calMonth, 1).toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
      renderCalendarView(calEl, { year: calYear, month: calMonth, grid, monthLabel }, {
        onPrev: () => { calMonth -= 1; if (calMonth < 0) { calMonth = 11; calYear -= 1; } paintCalCard(); },
        onNext: () => { calMonth += 1; if (calMonth > 11) { calMonth = 0; calYear += 1; } paintCalCard(); },
        onToday: () => { const t = new Date(); calYear = t.getFullYear(); calMonth = t.getMonth(); paintCalCard(); },
        onSelectDay: (date) => openDayDrawer(date, aggregatesByDate),
        onCreateEntryForDate: () => {},
      });
    } catch (err) {
      console.error('Journal hub calendar load error:', err);
      renderErrorState(calEl, err.message || "Couldn't load your calendar.", paintCalCard);
    }
  }

  function openDayDrawer(date, aggregatesByDate) {
    const aggregate = aggregatesByDate.get(date) || { date, tradeCount: 0, netPnl: null, wins: 0, losses: 0, breakeven: 0, cleanExecution: null, journalComplete: null, missedSetup: false };
    const trades = calAllEntries.filter((e) => e.tradeDate === date);
    const drawerRoot = document.getElementById('jhDrawerRoot');
    renderTradeDayDrawer(drawerRoot, { date, aggregate, trades, plan: calActivePlan }, {
      onClose: () => closeTradeDayDrawer(drawerRoot),
      apiFetch,
    });
    hydrateTscShots(drawerRoot, apiFetch);
  }
</script>

</body>
</html>
