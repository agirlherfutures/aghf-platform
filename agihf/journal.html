<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Journal — A Girl & Her Futures</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,700;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/tokens.css">
<link rel="stylesheet" href="shared/sidebar.css">
<link rel="stylesheet" href="shared/components.css">
<link rel="stylesheet" href="shared/dayli-desk.css">
<link rel="stylesheet" href="shared/dayli-desk-v2.css">
<link rel="stylesheet" href="shared/journal-v2.css">
</head>
<body>

<script src="shared/auth-guard.js"></script>
<script src="shared/sidebar.js" data-active="journal"></script>

<main class="main dz jv">
  <div class="dz-glow a"></div><div class="dz-glow b"></div><div class="dz-glow c"></div>

  <div class="jv-head">
    <div><span class="jv-eyebrow">✦ Your trade journal</span><h1>Your month <em class="jv-p">at a glance.</em></h1></div>
    <div class="jv-head-actions">
      <a class="jv-btn" href="journal-entry.html">✦ Log a trade</a>
      <button type="button" class="jv-btn ghost" id="ddNewPre">Pre-market note</button>
      <button type="button" class="jv-btn ghost purple" id="ddNewPost">Post-market note</button>
      <button type="button" class="jv-btn ghost plain" id="jvPrivacy" aria-pressed="false">Hide P&amp;L</button>
    </div>
  </div>

  <section class="jv-stats" id="jvStats">
    <div class="jv-st" style="--c:#3E9E93"><small id="jvStMonth">This month</small><b id="jvStNet">…</b><span>net P&amp;L</span></div>
    <div class="jv-st" style="--c:#7F77DD"><small>Green days</small><b id="jvStGreen">…</b><span id="jvStGreenSub">days traded</span></div>
    <div class="jv-st" style="--c:#F5A857"><small>Followed plan</small><b id="jvStPlan">…</b><span>of trades</span></div>
    <div class="jv-st" style="--c:#F4829A"><small>Best day</small><b id="jvStBest">…</b><span id="jvStBestSub"></span></div>
  </section>

  <section class="jv-cal-wrap">
    <div id="jhCalCard"></div>
    <aside class="jv-day" id="jvDay" aria-live="polite"></aside>
  </section>

  <div class="jv-sec">
    <div><span class="jv-kicker">Your trades</span><h2 id="jvListTitle">This month’s <em class="jv-t">trades.</em></h2></div>
    <div class="jv-switch" role="group" aria-label="List style">
      <button type="button" data-view="cards" class="on">Cards</button>
      <button type="button" data-view="timeline">Timeline</button>
    </div>
  </div>
  <div class="jv-filters" id="jvFilters"></div>
  <div id="jhRecent"></div>
  <div class="jv-more"><a href="journal-history.html">Full history, filters and insights →</a></div>

  <div id="jhDrawerRoot"></div>
</main>

<script type="module">
  const $ = (id) => document.getElementById(id);
  let mods = {};
  let allTrades = [];
  let allReflections = [];
  let allChecklists = [];
  let activePlan = null;
  const today = new Date();
  let calYear = today.getFullYear();
  let calMonth = today.getMonth();
  let selectedDate = null;
  let filter = 'all';
  let view = (() => { try { return localStorage.getItem('aghf_journal_view') || 'cards'; } catch { return 'cards'; } })();

  function renderFallbackError(err) {
    console.error('Journal failed to load:', err);
    document.querySelector('.main').innerHTML = `
      <div style="max-width:520px;margin:40px auto;padding:28px;background:#fff;border-radius:16px;border:1px solid #F1E7E1;text-align:center;">
        <div style="font-size:1.1rem;font-weight:700;color:#3D2B20;margin-bottom:8px;">Something went wrong loading your journal</div>
        <div style="font-size:.88rem;color:#7A5C50;margin-bottom:18px;word-break:break-word;">${(err && err.message) ? err.message : 'An unexpected error occurred.'}</div>
        <button type="button" onclick="location.reload()" style="padding:10px 22px;border-radius:999px;border:none;background:#F4829A;color:#fff;font-weight:600;cursor:pointer;">Reload</button>
      </div>`;
  }

  const ymd = (y, m, d) => `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
  const monthPrefix = () => `${calYear}-${String(calMonth + 1).padStart(2, '0')}`;
  const monthTrades = () => allTrades.filter((t) => t.tradeDate?.startsWith(monthPrefix()));

  function monthAggregates() {
    const { groupEntriesByDay, groupChecklistsByDay, computeDayAggregate } = mods.math;
    const byDay = groupEntriesByDay(allTrades);
    const checklistsByDay = groupChecklistsByDay(allChecklists);
    const prefix = monthPrefix();
    const out = new Map();
    for (const [date, trades] of byDay.entries()) {
      if (date.startsWith(prefix)) out.set(date, computeDayAggregate(date, trades, checklistsByDay.get(date) || []));
    }
    for (const [date, list] of checklistsByDay.entries()) {
      if (date.startsWith(prefix) && !out.has(date)) out.set(date, computeDayAggregate(date, [], list));
    }
    return out;
  }

  function paintStats(aggs) {
    const { money } = mods.v2;
    const days = [...aggs.values()].filter((a) => a.tradeCount);
    const trades = monthTrades();
    const hide = localStorage.getItem('aghf_snapshot_private') === '1';
    const net = days.reduce((s, a) => s + (a.netPnl || 0), 0);
    $('jvStMonth').textContent = new Date(calYear, calMonth, 1).toLocaleDateString('en-US', { month: 'long' });
    $('jvStNet').textContent = days.length ? money(net) : '–';
    $('jvStNet').classList.toggle('dd-blurred', hide && days.length > 0);
    $('jvStGreen').textContent = days.length ? `${days.filter((a) => a.netPnl > 0).length} of ${days.length}` : '–';
    $('jvStGreenSub').textContent = days.length === 1 ? 'day traded' : 'days traded';
    const rated = trades.filter((t) => t.ruleCheck);
    $('jvStPlan').textContent = rated.length ? `${Math.round((rated.filter((t) => t.ruleCheck === 'yes').length / rated.length) * 100)}%` : '–';
    const best = days.filter((a) => a.netPnl > 0).sort((a, b) => b.netPnl - a.netPnl)[0];
    $('jvStBest').textContent = best ? money(best.netPnl) : '–';
    $('jvStBest').classList.toggle('dd-blurred', hide && !!best);
    $('jvStBestSub').textContent = best ? new Date(`${best.date}T12:00:00`).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }) : 'no green days yet';
  }

  function defaultSelected(aggs) {
    const t = ymd(today.getFullYear(), today.getMonth(), today.getDate());
    if (t.startsWith(monthPrefix()) && aggs.get(t)?.tradeCount) return t;
    const traded = [...aggs.values()].filter((a) => a.tradeCount).map((a) => a.date).sort();
    if (traded.length) return traded[traded.length - 1];
    return t.startsWith(monthPrefix()) ? t : ymd(calYear, calMonth, 1);
  }

  function paintDay(aggs) {
    const el = $('jvDay');
    const date = selectedDate;
    const trades = allTrades.filter((t) => t.tradeDate === date);
    const reflections = allReflections.filter((r) => r.tradeDate === date);
    el.innerHTML = mods.v2.dayPanelHtml({
      date, aggregate: aggs.get(date) || null, trades, reflections,
      planNote: activePlan && aggs.get(date)?.tradeCount ? mods.cal.renderDayVsPlanNote(aggs.get(date), activePlan) : '',
    });
    mods.cal.wireDayPanel(el);
  }

  function paintCalendar() {
    const aggs = monthAggregates();
    if (!selectedDate || !selectedDate.startsWith(monthPrefix())) selectedDate = defaultSelected(aggs);
    const grid = mods.math.computeMonthGrid(calYear, calMonth, aggs);
    const tradesByDate = mods.math.groupEntriesByDay(monthTrades());
    const monthLabel = new Date(calYear, calMonth, 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
    const move = (delta) => { calMonth += delta; if (calMonth < 0) { calMonth = 11; calYear -= 1; } if (calMonth > 11) { calMonth = 0; calYear += 1; } selectedDate = null; paintAll(); };
    mods.cal.renderCalendarView($('jhCalCard'), { year: calYear, month: calMonth, grid, monthLabel, tradesByDate, selectedDate }, {
      onPrev: () => move(-1),
      onNext: () => move(1),
      onToday: () => { calYear = today.getFullYear(); calMonth = today.getMonth(); selectedDate = null; paintAll(); },
      onSelectDay: (date) => {
        if (!date.startsWith(monthPrefix())) { [calYear, calMonth] = [Number(date.slice(0, 4)), Number(date.slice(5, 7)) - 1]; }
        selectedDate = date;
        paintAll();
        if (window.matchMedia('(max-width:1100px)').matches) $('jvDay').scrollIntoView({ behavior: 'smooth', block: 'start' });
      },
    });
    paintStats(aggs);
    paintDay(aggs);
  }

  const FILTERS = [
    ['all', 'All', () => true],
    ['wins', 'Wins', (t) => t.outcome === 'win' || (t.netPnl ?? 0) > 0],
    ['losses', 'Losses', (t) => t.outcome === 'loss' || (t.netPnl ?? 0) < 0],
    ['plan', 'Followed plan', (t) => t.ruleCheck === 'yes'],
    ['broke', 'Broke a rule', (t) => t.ruleCheck === 'no' || t.ruleCheck === 'mostly'],
  ];

  function paintList() {
    const trades = monthTrades();
    const instruments = [...new Set(trades.map((t) => t.instrument).filter(Boolean))];
    const all = [...FILTERS, ...(instruments.length > 1 ? instruments.map((i) => [`i:${i}`, i, (t) => t.instrument === i]) : [])];
    if (!all.some(([k]) => k === filter)) filter = 'all';
    $('jvFilters').innerHTML = trades.length ? all.map(([k, label]) => `<button type="button" class="jv-chipbtn${k === filter ? ' on' : ''}" data-filter="${mods.v2.esc(k)}">${mods.v2.esc(label)}</button>`).join('') : '';
    $('jvFilters').querySelectorAll('[data-filter]').forEach((b) => b.addEventListener('click', () => { filter = b.dataset.filter; paintList(); }));
    document.querySelectorAll('.jv-switch [data-view]').forEach((b) => b.classList.toggle('on', b.dataset.view === view));
    const monthName = new Date(calYear, calMonth, 1).toLocaleDateString('en-US', { month: 'long' });
    $('jvListTitle').innerHTML = `${monthName}’s <em class="jv-t">trades.</em>`;
    const pick = all.find(([k]) => k === filter)[2];
    const shown = trades.filter(pick).sort((a, b) => (b.tradeDate + (b.entryTime || '')).localeCompare(a.tradeDate + (a.entryTime || '')));
    const el = $('jhRecent');
    if (!trades.length) {
      el.innerHTML = `<div class="jv-empty"><h3>No trades in ${monthName} <em class="jv-p">yet.</em></h3><p>Every trade you log shows up here and on the calendar.</p><a class="jv-btn" href="journal-entry.html">✦ Log a trade</a></div>`;
      return;
    }
    if (!shown.length) { el.innerHTML = '<div class="jv-empty"><p>No trades match this filter.</p></div>'; return; }
    el.innerHTML = view === 'timeline' ? mods.v2.timelineHtml(shown) : `<div class="jv-cards">${shown.map((t) => mods.v2.tradeCardHtml(t)).join('')}</div>`;
    mods.engine.hydrateTscShots(el, mods.authFetch);
  }

  function paintPrivacy() {
    const hidden = localStorage.getItem('aghf_snapshot_private') === '1';
    $('jvPrivacy').textContent = hidden ? 'Show P&L' : 'Hide P&L';
    $('jvPrivacy').setAttribute('aria-pressed', String(hidden));
  }

  function paintAll() { paintCalendar(); paintList(); paintPrivacy(); }

  async function loadData() {
    const { listEntries } = mods.journal;
    const [trades, pre, post, checklists, plans] = await Promise.all([
      listEntries({ entryType: 'trade', limit: 500 }),
      listEntries({ entryType: 'premarket_reflection', limit: 200 }).catch(() => ({ entries: [] })),
      listEntries({ entryType: 'postmarket_reflection', limit: 200 }).catch(() => ({ entries: [] })),
      mods.checklist.listChecklists(500),
      mods.evalService.listEvalPlans().catch(() => []),
    ]);
    allTrades = trades.entries;
    allReflections = [...pre.entries, ...post.entries];
    allChecklists = checklists;
    activePlan = plans.find((p) => p.isActive) || null;
  }

  async function boot() {
    try {
      const [journal, desk, checklist, evalService, v2, math, cal, engine, af] = await Promise.all([
        import('./shared/journal-service.js'),
        import('./shared/dayli-desk-engine.js'),
        import('./shared/checklist-service.js'),
        import('./shared/eval-service.js'),
        import('./shared/journal-v2.js'),
        import('./shared/journal-calendar-math.js'),
        import('./shared/journal-calendar-engine.js'),
        import('./shared/journal-engine.js'),
        import('./shared/auth-fetch.js'),
      ]);
      mods = { journal, desk, checklist, evalService, v2, math, cal, engine, authFetch: af.authFetch };
    } catch (err) {
      renderFallbackError(err);
      return;
    }

    const { QUICK_JOURNAL_PROMPTS, saveReflection } = mods.journal;
    const reflect = (kind) => {
      const list = QUICK_JOURNAL_PROMPTS[kind];
      const prompt = list[Math.floor(Math.random() * list.length)];
      mods.desk.openJournalModal(kind, prompt, async (entry) => {
        await saveReflection(`${kind}_reflection`, entry.prompt, entry.text);
        await loadData();
        paintAll();
      });
    };
    $('ddNewPre').addEventListener('click', () => reflect('premarket'));
    $('ddNewPost').addEventListener('click', () => reflect('postmarket'));
    $('jvPrivacy').addEventListener('click', () => {
      const hidden = localStorage.getItem('aghf_snapshot_private') === '1';
      try { localStorage.setItem('aghf_snapshot_private', hidden ? '0' : '1'); } catch { /* private window */ }
      paintAll();
    });
    document.querySelectorAll('.jv-switch [data-view]').forEach((b) => b.addEventListener('click', () => {
      view = b.dataset.view;
      try { localStorage.setItem('aghf_journal_view', view); } catch { /* private window */ }
      paintList();
    }));

    mods.desk.renderSkeleton($('jhCalCard'), 4);
    try {
      await loadData();
      paintAll();
    } catch (err) {
      console.error('Journal load error:', err);
      mods.desk.renderErrorState($('jhCalCard'), err.message || "Couldn't load your journal.", boot);
    }
  }

  document.addEventListener('aghf-auth-ready', async () => {
    try { await boot(); } finally { window.AGHF_HIDE_LOADER?.(); }
  }, { once: true });
</script>

</body>
</html>
