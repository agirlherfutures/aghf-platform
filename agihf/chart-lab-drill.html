<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chart Lab Drill — A Girl & Her Futures</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,700;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/tokens.css">
<link rel="stylesheet" href="shared/sidebar.css">
<link rel="stylesheet" href="shared/components.css">
<link rel="stylesheet" href="shared/dayli-desk.css">
<link rel="stylesheet" href="shared/chartlab.css">
</head>
<body class="chartlab-page">

<script src="shared/auth-guard.js"></script>
<script src="shared/sidebar.js" data-active="chart-lab"></script>

<main class="main">
  <div class="pg-eye"><a href="chart-lab.html" style="color:inherit;text-decoration:none;">← Chart Lab</a></div>
  <div id="clDrillRoot"></div>
</main>

<script type="module">
  let getDrill, submitAttempt, getCurrentSession, updateSession, reportDrill;
  let renderDrillPlayer, renderRevealScreen, renderSessionResults;
  let savePlaybookItem;

  const root = document.getElementById('clDrillRoot');
  const params = new URLSearchParams(location.search);

  let session = null;
  let drillIds = [];
  let position = 0;
  const sessionStats = { completed: 0, correct: 0, partial: 0, reviewNeeded: 0, gpEarned: 0 };

  function renderFallbackError(err) {
    console.error('Chart Lab drill failed to load:', err);
    root.innerHTML = `
      <div style="max-width:520px;margin:40px auto;padding:28px;background:#fff;border-radius:16px;border:1px solid #F1E7E1;text-align:center;">
        <div style="font-size:1.1rem;font-weight:700;color:#3D2B20;margin-bottom:8px;">Something went wrong loading this drill</div>
        <div style="font-size:.88rem;color:#7A5C50;margin-bottom:18px;word-break:break-word;">${(err && err.message) ? err.message : 'An unexpected error occurred.'}</div>
        <a href="chart-lab.html" style="padding:10px 22px;border-radius:999px;border:none;background:#F4829A;color:#fff;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block;">Back to Chart Lab</a>
      </div>`;
  }

  function askAgentAboutDrill(drill, attemptResult) {
    sessionStorage.setItem('aghf_pending_agent_attachment', JSON.stringify({
      type: 'chart_lab_question',
      metadata: {
        question: drill.question, drillTitle: drill.title, skillCategory: drill.skillCategory,
        memberResult: attemptResult.result, explanation: attemptResult.reveal.explanation,
        commonMistake: attemptResult.reveal.commonMistake, relatedRule: attemptResult.reveal.relatedRule,
      },
      label: `Chart Lab: ${drill.title}`,
    }));
    location.href = 'psychology.html';
  }

  async function saveToPlaybook(drill, attemptResult) {
    try {
      await savePlaybookItem({
        category: 'chart_lab_example', title: drill.title, content: attemptResult.reveal.explanation,
        sourceType: 'chart_lab', sourceRecordId: attemptResult.attemptId,
      });
      alert('Saved to My Playbook ✦');
    } catch (err) { alert("Couldn't save — " + err.message); }
  }

  async function loadDrill(drillId) {
    const { drill, answerKeyPreview } = await getDrill(drillId);
    if (!drill) { renderFallbackError(new Error('Drill not found')); return; }
    await renderDrillPlayer(root, drill, answerKeyPreview, {
      onSubmit: async (memberAnswer, hintsUsed) => {
        if (!memberAnswer) return;
        const result = await submitAttempt({ drillId: drill.id, memberAnswer, hintsUsed, sessionId: session?.id });
        sessionStats.completed += 1;
        sessionStats.gpEarned += result.gpAwarded || 0;
        if (result.result === 'correct') sessionStats.correct += 1;
        else if (result.result === 'partial') sessionStats.partial += 1;
        else sessionStats.reviewNeeded += 1;

        const hasNext = session && position < drillIds.length - 1;
        renderRevealScreen(root, result, drill, {
          hasNext,
          onNext: async () => {
            if (hasNext) {
              position += 1;
              if (session) await updateSession(session.id, { currentPosition: position });
              await loadDrill(drillIds[position]);
            } else if (session) {
              await updateSession(session.id, { status: 'completed' });
              showSessionResults();
            } else {
              location.href = 'chart-lab.html';
            }
          },
          onAskAgent: (reveal) => askAgentAboutDrill(drill, result),
          onSaveToPlaybook: () => saveToPlaybook(drill, result),
        });
      },
      onReport: async (reason, description) => { await reportDrill(drill.id, reason, description); },
    });
  }

  function showSessionResults() {
    const total = sessionStats.completed || 1;
    const pct = Math.round((sessionStats.correct / total) * 100);
    const summaryLine = pct >= 80
      ? `Strong session — you got ${sessionStats.correct} of ${sessionStats.completed} right. Keep this pace up.`
      : pct >= 50
        ? `You're building real pattern recognition — ${sessionStats.correct} of ${sessionStats.completed} correct this round. Review the ones marked below before moving to a harder difficulty.`
        : `This skill needs a bit more practice — ${sessionStats.correct} of ${sessionStats.completed} correct. That's exactly what practice is for.`;
    renderSessionResults(root, { ...sessionStats, summaryLine }, {
      onContinue: () => { location.href = 'chart-lab.html'; },
      onReviewMistakes: () => { location.href = 'chart-lab.html#mistakes'; },
    });
  }

  async function boot() {
    try {
      ({ getDrill, submitAttempt, getCurrentSession, updateSession, reportDrill } = await import('./shared/chartlab-service.js'));
      ({ renderDrillPlayer, renderRevealScreen, renderSessionResults } = await import('./shared/chartlab-engine.js'));
      ({ savePlaybookItem } = await import('./shared/psychology-service.js'));
    } catch (err) {
      renderFallbackError(err);
      return;
    }

    try {
      const sessionId = params.get('sessionId');
      const drillId = params.get('drillId');

      if (sessionId) {
        const { session: current } = await getCurrentSession();
        if (current && current.id === sessionId) {
          session = current;
          drillIds = session.drillIds || session.drill_ids || [];
          position = session.currentPosition ?? session.current_position ?? 0;
          if (position >= drillIds.length) { showSessionResults(); return; }
          await loadDrill(drillIds[position]);
          return;
        }
      }
      if (drillId) { await loadDrill(drillId); return; }
      renderFallbackError(new Error('No drill or session specified.'));
    } catch (err) {
      renderFallbackError(err);
    }
  }

  document.addEventListener('aghf-auth-ready', boot);
</script>

</body>
</html>
