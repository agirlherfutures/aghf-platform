<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Psychology History — A Girl & Her Futures</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,700;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/tokens.css">
<link rel="stylesheet" href="shared/sidebar.css">
<link rel="stylesheet" href="shared/components.css">
<link rel="stylesheet" href="shared/dayli-desk.css">
</head>
<body>

<script src="shared/auth-guard.js"></script>
<script src="shared/sidebar.js" data-active="psychology"></script>

<main class="main">
  <div class="dd-header-top">
    <div>
      <div class="pg-eye">✦ Psychology History</div>
      <div class="pg-title">Every coaching session you’ve chosen to save.</div>
    </div>
    <a class="dd-secondary-btn" href="psychology.html">← Coach Home</a>
  </div>
  <div class="dd-section" id="psyHistoryArea"></div>
</main>

<script type="module">
  import { listPsychologySessions, deletePsychologySession } from './shared/psychology-service.js';
  import { renderHistoryList } from './shared/psychology-engine.js';
  import { renderSkeleton, renderErrorState } from './shared/dayli-desk-engine.js';

  const area = document.getElementById('psyHistoryArea');

  async function load() {
    renderSkeleton(area, 3);
    try {
      const sessions = await listPsychologySessions();
      renderHistoryList(area, sessions, { onDelete: async (id) => { await deletePsychologySession(id); load(); } });
    } catch (err) {
      console.error('Psychology history load error:', err);
      renderErrorState(area, err.setupRequired ? err.message : 'Couldn’t load your history.', load);
    }
  }

  document.addEventListener('aghf-auth-ready', load);
</script>

</body>
</html>
