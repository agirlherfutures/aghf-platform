<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Share My Win — A Girl & Her Futures</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,700;1,300&family=Caveat:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/tokens.css">
<link rel="stylesheet" href="shared/sidebar.css">
<link rel="stylesheet" href="shared/components.css">
<link rel="stylesheet" href="shared/dayli-desk.css">
<link rel="stylesheet" href="shared/wins.css">
</head>
<body class="wins-page">

<script src="shared/auth-guard.js"></script>
<script src="shared/sidebar.js" data-active="leaderboard"></script>

<main class="main">
  <div id="winStars"></div>
  <div id="winReviews"></div>
  <div id="winHero"></div>
  <div id="winFeatured" style="margin-bottom:28px;"></div>
  <div class="dd-section-head">
    <div class="dd-section-title">Community Win Wall</div>
    <a class="dd-section-link" href="my-wins.html">My Wins →</a>
  </div>
  <div id="winFilters"></div>
  <div id="winWall"></div>
  <div id="winDrawerRoot"></div>
</main>

<script type="module">
  let listPublicWins, getWin, getReactions, toggleReaction;
  let renderFiveStarBanner, renderReviewsScroll, renderFeaturedWinsStrip, renderWinFilters, renderCommunityWinWall, renderWinDetailDrawer, closeWinDetailDrawer;
  let HERO_COPY;

  const starsEl = document.getElementById('winStars');
  const reviewsEl = document.getElementById('winReviews');
  const heroEl = document.getElementById('winHero');
  const featuredEl = document.getElementById('winFeatured');
  const filtersEl = document.getElementById('winFilters');
  const wallEl = document.getElementById('winWall');
  const drawerEl = document.getElementById('winDrawerRoot');

  function renderFallbackError(err) {
    console.error('Share My Win page failed to load:', err);
    wallEl.innerHTML = `
      <div style="max-width:520px;margin:40px auto;padding:28px;background:#fff;border-radius:16px;border:1px solid #F1E7E1;text-align:center;">
        <div style="font-size:1.1rem;font-weight:700;color:#3D2B20;margin-bottom:8px;">Something went wrong loading Share My Win</div>
        <div style="font-size:.88rem;color:#7A5C50;margin-bottom:18px;word-break:break-word;">${(err && err.message) ? err.message : 'An unexpected error occurred.'}</div>
        <button type="button" onclick="location.reload()" style="padding:10px 22px;border-radius:999px;border:none;background:#F4829A;color:#fff;font-weight:600;cursor:pointer;">Reload</button>
      </div>`;
  }

  let activeFilter = 'all';
  let allWins = [];

  function paintHero() {
    heroEl.innerHTML = `
      <div class="win-hero">
        <span class="win-hero-sparkle s1">✦</span><span class="win-hero-sparkle s2">✦</span><span class="win-hero-sparkle s3">✧</span>
        <div class="win-hero-eyebrow">${HERO_COPY.eyebrow}</div>
        <div class="win-hero-title">${HERO_COPY.title}</div>
        <div class="win-hero-tagline">${HERO_COPY.tagline}</div>
        <p class="win-hero-supporting">${HERO_COPY.supporting}</p>
        <div class="win-hero-actions">
          <a class="dd-primary-btn" href="share-win-flow.html">${HERO_COPY.primaryCta}</a>
          <a class="dd-secondary-btn" href="#winWall">${HERO_COPY.secondaryCta}</a>
        </div>
      </div>`;
  }

  async function loadWall() {
    try {
      allWins = await listPublicWins({ sort: 'featured' });
      const featured = allWins.filter((w) => w.status === 'featured').slice(0, 4);
      renderFeaturedWinsStrip(featuredEl, featured);
      applyFilter();
    } catch (err) {
      console.error('Win wall load error:', err);
      renderFallbackError(err);
    }
  }

  function applyFilter() {
    renderWinFilters(filtersEl, activeFilter, (key) => { activeFilter = key; applyFilter(); });
    const filtered = activeFilter === 'all' ? allWins : allWins.filter((w) => w.primaryCategory === activeFilter || w.secondaryCategory === activeFilter);
    renderCommunityWinWall(wallEl, filtered, { onOpenWin: openWin });
  }

  async function openWin(id) {
    try {
      const win = await getWin(id);
      if (!win) return;
      const paintDrawer = async () => {
        const reactionData = await getReactions(id);
        renderWinDetailDrawer(drawerEl, win, reactionData, {
          onClose: () => closeWinDetailDrawer(drawerEl),
          onToggle: async (reactionType, active) => { await toggleReaction(id, reactionType, active); paintDrawer(); },
        });
      };
      paintDrawer();
    } catch (err) {
      console.error('Open win error:', err);
    }
  }

  async function boot() {
    try {
      ({ listPublicWins, getWin, getReactions, toggleReaction } = await import('./shared/wins-service.js'));
      ({ renderFiveStarBanner, renderReviewsScroll, renderFeaturedWinsStrip, renderWinFilters, renderCommunityWinWall, renderWinDetailDrawer, closeWinDetailDrawer } = await import('./shared/wins-engine.js'));
      ({ HERO_COPY } = await import('./shared/wins-copy.js'));
    } catch (err) {
      renderFallbackError(err);
      return;
    }
    starsEl.innerHTML = renderFiveStarBanner();
    renderReviewsScroll(reviewsEl);
    paintHero();
    loadWall();
  }

  document.addEventListener('aghf-auth-ready', boot);
</script>

</body>
</html>
