<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leaderboard — A Girl & Her Futures</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,700;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/tokens.css">
<link rel="stylesheet" href="shared/components.css">
</head>
<body>

<script src="shared/auth-guard.js"></script>
<script src="shared/nav.js" data-active="leaderboard"></script>

<div class="page-title-block">
  <div class="page-eyebrow">Weekly rankings</div>
  <div class="page-title">Leaderboard</div>
  <div class="page-sub">Top traders this week. Show up, stack GP, climb.</div>
</div>

<div class="page-shell">
  <div class="leaderboard-card">
    <div class="leaderboard-title">This week's top traders</div>
    <div id="lbRows"></div>
  </div>
</div>

<script type="module">
  const RANKS = [
    { rank: 1, initials: 'SK', handle: '@skye.trades', level: "Level 3 · She's In Structure", gp: 2840, cls: 'gold' },
    { rank: 2, initials: 'MR', handle: '@mia.in.structure', level: "Level 3 · She's In Structure", gp: 2210, cls: 'silver' },
    { rank: 3, initials: 'JL', handle: '@justine.l', level: "Level 3 · She's In Structure", gp: 1980, cls: 'bronze' },
    { rank: 4, initials: 'AK', handle: '@ash.khadra', level: 'Level 2 · Structure Student', gp: 1640 },
    { rank: 5, initials: 'NB', handle: '@naya.b', level: 'Level 2 · Structure Student', gp: 1420 },
    { rank: 6, initials: 'CW', handle: '@cam.wins', level: 'Level 2 · Structure Student', gp: 1180 },
    { rank: 7, initials: 'TR', handle: '@trin.r', level: "Level 1 · She's Brand New", gp: 920 },
    { rank: 8, initials: 'SL', handle: '@sara.learns', level: "Level 1 · She's Brand New", gp: 710 },
    { rank: 9, initials: 'KM', handle: '@k.mack', level: "Level 1 · She's Brand New", gp: 580 },
    { rank: 10, initials: 'PP', handle: '@priya.p', level: "Level 1 · She's Brand New", gp: 440 },
  ];

  function rowHtml(r, isYou) {
    return `<div class="lb-row ${isYou ? 'you' : ''}">
      <div class="lb-rank ${r.cls || ''}">${r.rank}</div>
      <div class="lb-avatar">${r.initials}</div>
      <div class="lb-name"><div class="lb-handle">${r.handle}</div><div class="lb-level">${r.level}</div></div>
      <div class="lb-gp">${r.gp.toLocaleString()} GP</div>
    </div>`;
  }

  async function render() {
    let youRow = { rank: 11, initials: 'D', handle: '@you', level: "Level 1 · She's Brand New", gp: 0 };
    try {
      const data = await window.AGHF_FETCH_PROFILE();
      const p = data.profile || {};
      const name = (p.full_name || window.AGHF_USER?.email || 'You');
      youRow.handle = '@' + name.split(' ')[0].toLowerCase() + ' (you)';
      youRow.initials = name.trim().charAt(0).toUpperCase();
      youRow.level = `Level ${p.level || 1} · ${p.level_name || "She's Brand New"}`;
      youRow.gp = p.gp || 0;
    } catch (err) {
      console.error('Profile load error:', err);
    }
    document.getElementById('lbRows').innerHTML = RANKS.map((r) => rowHtml(r, false)).join('') + rowHtml(youRow, true);
  }

  document.addEventListener('aghf-auth-ready', render);
</script>

</body>
</html>
