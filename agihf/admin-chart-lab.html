<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chart Lab Builder — A Girl & Her Futures</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,700;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/tokens.css">
<link rel="stylesheet" href="shared/sidebar.css">
<link rel="stylesheet" href="shared/components.css">
<link rel="stylesheet" href="shared/dayli-desk.css">
<link rel="stylesheet" href="shared/chartlab.css">
</head>
<body class="chartlab-page">

<script src="shared/auth-guard.js"></script>
<script src="shared/sidebar.js" data-active="chart-lab"></script>

<main class="main">
  <div class="pg-eye">✦ Admin</div>
  <div class="pg-title">Chart Lab Builder</div>
  <div class="small-help" style="margin:-8px 0 18px;">Only visible to AGHF administrators. Every action here is checked again on the server — this page's own gate is a convenience, not the real one.</div>
  <div id="adminClRoot"></div>
</main>

<script type="module">
  let adminListDrills, adminGetDrillDetail, adminCreateDrill, adminUpdateDrill, adminUpsertAnswerKey,
      adminUploadChartImage, adminSetDrillStatus, adminDuplicateDrill, adminListReports, adminRespondReport, resolveChartImageUrl;
  let SKILL_CATEGORIES, DIFFICULTY_LABELS, DRILL_TYPE_LABELS, CHOICES_BY_DRILL_TYPE;

  const root = document.getElementById('adminClRoot');
  let drills = [];
  let activeId = null;
  let activeAnswerKey = null;
  let zones = []; // working zone list while editing a spot_it/mark_the_chart drill
  let placingCredit = 'full';
  let viewMode = 'drills'; // 'drills' | 'reports'
  let reports = [];

  function escapeHtml(s) { return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

  function renderFallbackError(err) {
    console.error('Chart Lab Builder failed to load:', err);
    root.innerHTML = `<div style="max-width:520px;margin:40px auto;padding:28px;background:#fff;border-radius:16px;border:1px solid #F1E7E1;text-align:center;">
      <div style="font-size:1.1rem;font-weight:700;color:#3D2B20;margin-bottom:8px;">Something went wrong loading the Chart Lab Builder</div>
      <div style="font-size:.88rem;color:#7A5C50;margin-bottom:18px;word-break:break-word;">${(err && err.message) ? err.message : 'An unexpected error occurred.'}</div>
      <button type="button" onclick="location.reload()" style="padding:10px 22px;border-radius:999px;border:none;background:#F4829A;color:#fff;font-weight:600;cursor:pointer;">Reload</button>
    </div>`;
  }

  function renderNotAuthorized() {
    root.innerHTML = `<div style="max-width:480px;margin:40px auto;padding:28px;background:#fff;border-radius:16px;border:1px solid #F1E7E1;text-align:center;">
      <div style="font-size:1.1rem;font-weight:700;color:#3D2B20;margin-bottom:8px;">Not authorized</div>
      <div style="font-size:.88rem;color:#7A5C50;">This page is for AGHF administrators only.</div>
    </div>`;
  }

  function active() { return drills.find((d) => d.id === activeId) || null; }

  function paint() {
    const d = active();
    const openReportCount = reports.filter((r) => r.status === 'open').length;
    root.innerHTML = `<div class="chal-admin-layout">
      <div class="chal-admin-list">
        <button type="button" class="dd-primary-btn" id="clNewBtn" style="width:100%;margin-bottom:8px;">+ New Drill</button>
        <button type="button" class="dd-secondary-btn" id="clReportsBtn" style="width:100%;margin-bottom:8px;${viewMode === 'reports' ? 'border-color:var(--pink);' : ''}">📋 Reports${openReportCount ? ` (${openReportCount} open)` : ''}</button>
        ${drills.map((row) => `<div class="chal-admin-row" data-select-id="${row.id}" style="cursor:pointer;${viewMode === 'drills' && row.id === activeId ? 'border-color:var(--pink);' : ''}">
          <span>${escapeHtml(row.title)}</span>
          <span class="chal-admin-status-pill">${row.status}</span>
        </div>`).join('')}
      </div>
      <div id="clDetail">${viewMode === 'reports' ? renderReportsPanel() : (d ? renderDetail(d) : '<p class="small-help">Select or create a drill to edit it.</p>')}</div>
    </div>`;

    document.getElementById('clNewBtn').addEventListener('click', onCreate);
    document.getElementById('clReportsBtn').addEventListener('click', async () => { viewMode = 'reports'; await refreshReports(); });
    root.querySelectorAll('[data-select-id]').forEach((row) => row.addEventListener('click', async () => { viewMode = 'drills'; activeId = row.dataset.selectId; await loadDetail(); }));
    if (viewMode === 'reports') wireReportsPanel();
    else if (d) wireDetail(d);
  }

  function renderReportsPanel() {
    if (!reports.length) return '<div class="dd-card"><p class="small-help">No drills have been reported. ✦</p></div>';
    return reports.map((r) => `
      <div class="dd-card" style="margin-bottom:14px;">
        <div class="chal-admin-status-pill" style="float:right;">${escapeHtml(r.status)}</div>
        <div class="cl2-section-heading">${escapeHtml(r.chart_lab_drills?.title || 'Untitled drill')}</div>
        <p class="small-help" style="margin:2px 0 8px;">Reported ${r.created_at ? new Date(r.created_at).toLocaleDateString() : ''}</p>
        <p style="margin:0 0 6px;"><strong>Reason:</strong> ${escapeHtml(r.reason)}</p>
        ${r.description ? `<p style="margin:0 0 10px;color:var(--muted);">${escapeHtml(r.description)}</p>` : ''}
        <div class="field-group"><label class="field-label">Status</label>
          <select class="field-input" data-report-status="${r.id}" style="width:auto;">
            <option value="open" ${r.status === 'open' ? 'selected' : ''}>Open</option>
            <option value="reviewed" ${r.status === 'reviewed' ? 'selected' : ''}>Reviewed</option>
            <option value="resolved" ${r.status === 'resolved' ? 'selected' : ''}>Resolved</option>
          </select>
        </div>
        <div class="field-group"><label class="field-label">Admin Response (optional, internal note)</label>
          <textarea class="field-textarea" data-report-response="${r.id}">${escapeHtml(r.admin_response || '')}</textarea>
        </div>
        <button type="button" class="dd-secondary-btn" data-report-save="${r.id}">Save</button>
      </div>
    `).join('');
  }

  function wireReportsPanel() {
    root.querySelectorAll('[data-report-save]').forEach((btn) => {
      btn.addEventListener('click', async () => {
        const id = btn.dataset.reportSave;
        const status = root.querySelector(`[data-report-status="${id}"]`).value;
        const adminResponse = root.querySelector(`[data-report-response="${id}"]`).value;
        try {
          await adminRespondReport(id, status, adminResponse);
          await refreshReports();
        } catch (err) { alert("Couldn't save — " + err.message); }
      });
    });
  }

  async function refreshReports() {
    const { reports: rows } = await adminListReports();
    reports = rows || [];
    paint();
  }

  function renderDetail(d) {
    return `
      <div class="dd-card" style="margin-bottom:16px;">
        <div class="cl2-section-heading">Drill Details</div>
        <div class="field-group"><label class="field-label">Title</label><input class="field-input" id="fTitle" value="${escapeHtml(d.title || '')}"></div>
        <div class="field-group"><label class="field-label">Description</label><textarea class="field-textarea" id="fDescription">${escapeHtml(d.description || '')}</textarea></div>
        <div class="chal-admin-2col">
          <div class="field-group"><label class="field-label">Drill Type</label><select class="field-input" id="fDrillType">${Object.entries(DRILL_TYPE_LABELS).map(([k, m]) => `<option value="${k}" ${k === d.drillType ? 'selected' : ''}>${m.label}</option>`).join('')}</select></div>
          <div class="field-group"><label class="field-label">Skill Category</label><select class="field-input" id="fSkillCategory">${SKILL_CATEGORIES.map((s) => `<option value="${s.key}" ${s.key === d.skillCategory ? 'selected' : ''}>${s.icon} ${s.label}</option>`).join('')}</select></div>
          <div class="field-group"><label class="field-label">Difficulty</label><select class="field-input" id="fDifficulty">${Object.entries(DIFFICULTY_LABELS).map(([k, m]) => `<option value="${k}" ${k === d.difficulty ? 'selected' : ''}>${m.label}</option>`).join('')}</select></div>
          <div class="field-group"><label class="field-label">Instrument</label><input class="field-input" id="fInstrument" value="${escapeHtml(d.instrument || 'MNQ')}"></div>
        </div>
        <div class="field-group"><label class="field-label">Question</label><textarea class="field-textarea" id="fQuestion">${escapeHtml(d.question || '')}</textarea></div>
        <div class="field-group"><label class="field-label">Lesson Key (optional, e.g. p1-14)</label><input class="field-input" id="fLessonKey" value="${escapeHtml(d.lessonKey || '')}"></div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;">
          <button type="button" class="dd-primary-btn" id="fSaveDetails">Save Details</button>
          <button type="button" class="dd-secondary-btn" id="fDuplicate">Duplicate</button>
          ${d.status === 'draft' ? '<button type="button" class="dd-primary-btn" id="fPublish">Publish</button>' : ''}
          ${d.status === 'published' ? '<button type="button" class="dd-secondary-btn" id="fUnpublish">Unpublish</button>' : ''}
          ${d.status !== 'archived' ? '<button type="button" class="cl-delete-link" id="fArchive" style="margin-left:auto;">Archive</button>' : ''}
        </div>
        ${d.isSeedPlaceholder ? '<p class="small-help" style="margin-top:8px;color:var(--peach);">⚠ This is dev/seed placeholder content — replace the chart image with a real AGHF-owned chart before relying on it in production.</p>' : ''}
      </div>

      <div class="dd-card" style="margin-bottom:16px;">
        <div class="cl2-section-heading">Chart Image</div>
        <input type="file" id="fChartFile" accept="image/png,image/jpeg,image/webp,image/gif">
        <p class="small-help">Current path: ${escapeHtml(d.chartImagePath || '(none yet)')}</p>
      </div>

      <div class="dd-card">
        <div class="cl2-section-heading">Answer Key</div>
        <div class="field-group"><label class="field-label">Answer Type</label>
          <select class="field-input" id="fAnswerType">
            <option value="choice">Choice (Valid/Invalid, Phase ID, etc.)</option>
            <option value="sequence">Sequence Builder</option>
            <option value="point">Point / Zone (Spot It)</option>
          </select>
        </div>
        <div id="clChoiceEditor"></div>
        <div id="clZoneEditor"></div>
        <div class="field-group"><label class="field-label">Explanation (shown after submission)</label><textarea class="field-textarea" id="fExplanation"></textarea></div>
        <div class="field-group"><label class="field-label">Common Mistake</label><input class="field-input" id="fCommonMistake"></div>
        <div class="field-group"><label class="field-label">Hints (one per line, shown progressively before submission)</label><textarea class="field-textarea" id="fHints"></textarea></div>
        <div class="field-group"><label class="field-label">Related Dayli ICC Rule</label><input class="field-input" id="fRelatedRule"></div>
        <button type="button" class="dd-primary-btn" id="fSaveAnswerKey">Save Answer Key</button>
        <p class="small-help" id="fVersionNote"></p>
      </div>
    `;
  }

  function renderChoiceEditor(answerType, choices, correctChoice, correctSequence) {
    const el = document.getElementById('clChoiceEditor');
    const zoneEl = document.getElementById('clZoneEditor');
    if (answerType === 'point') { el.innerHTML = ''; zoneEl.hidden = false; return; }
    zoneEl.hidden = true;
    const rows = choices.length ? choices : [{ key: '', label: '' }];
    el.innerHTML = `
      <div id="clChoiceRows">${rows.map((c, i) => `
        <div class="chal-admin-2col" style="margin-bottom:6px;">
          <input class="field-input" placeholder="key" data-choice-key="${i}" value="${escapeHtml(c.key)}">
          <input class="field-input" placeholder="label" data-choice-label="${i}" value="${escapeHtml(c.label)}">
        </div>`).join('')}</div>
      <button type="button" class="cl2-hint-btn" id="fAddChoiceRow">+ Add choice</button>
      ${answerType === 'choice' ? `<div class="field-group"><label class="field-label">Correct Choice (key)</label><input class="field-input" id="fCorrectChoice" value="${escapeHtml(correctChoice || '')}"></div>` : ''}
      ${answerType === 'sequence' ? `<div class="field-group"><label class="field-label">Correct Sequence (comma-separated keys, in order)</label><input class="field-input" id="fCorrectSequence" value="${escapeHtml((correctSequence || []).join(','))}"></div>` : ''}
    `;
    document.getElementById('fAddChoiceRow').addEventListener('click', () => {
      const container = document.getElementById('clChoiceRows');
      const i = container.children.length;
      const row = document.createElement('div');
      row.className = 'chal-admin-2col';
      row.style.marginBottom = '6px';
      row.innerHTML = `<input class="field-input" placeholder="key" data-choice-key="${i}"><input class="field-input" placeholder="label" data-choice-label="${i}">`;
      container.appendChild(row);
    });
  }

  function collectChoices() {
    const keys = Array.from(document.querySelectorAll('[data-choice-key]'));
    const labels = Array.from(document.querySelectorAll('[data-choice-label]'));
    return keys.map((k, i) => ({ key: k.value.trim(), label: labels[i]?.value.trim() || '' })).filter((c) => c.key);
  }

  function renderZoneEditor(d, existingZones) {
    zones = existingZones || [];
    const el = document.getElementById('clZoneEditor');
    el.innerHTML = `
      <p class="small-help">Click the chart to place a zone at the current credit level. Coordinates are stored as fractions (0-1) of the image, so they work at any screen size.</p>
      <div style="display:flex;gap:10px;align-items:center;margin-bottom:8px;">
        <label class="field-label" style="margin:0;">Placing:</label>
        <select class="field-input" id="fPlacingCredit" style="width:auto;">
          <option value="full">Full credit</option>
          <option value="partial">Partial credit</option>
        </select>
        <button type="button" class="cl2-hint-btn" id="fClearZones">Clear zones</button>
      </div>
      <div class="cl2-chart-wrap"><canvas id="clZoneCanvas" width="780" height="320" style="width:100%;height:auto;cursor:crosshair;"></canvas></div>
      <p class="small-help" id="clZoneList"></p>
    `;
    document.getElementById('fPlacingCredit').addEventListener('change', (e) => { placingCredit = e.target.value; });
    document.getElementById('fClearZones').addEventListener('click', () => { zones = []; redrawZoneCanvas(); });

    const canvas = document.getElementById('clZoneCanvas');
    const ctx = canvas.getContext('2d');
    let img = null;
    if (d.chartAssetUrl || d.chartImagePath) {
      resolveChartImageUrl(d).then((url) => {
        if (!url) return;
        const image = new Image();
        image.onload = () => { img = image; redrawZoneCanvas(); };
        image.src = url;
      }).catch((err) => console.error('Chart Lab: failed to load chart image for zone editor', err));
    }
    function redrawZoneCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#FFFBF9'; ctx.fillRect(0, 0, canvas.width, canvas.height);
      if (img) ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      zones.forEach((z) => {
        ctx.beginPath();
        ctx.arc(z.x * canvas.width, z.y * canvas.height, (z.radius || 0.06) * canvas.width, 0, Math.PI * 2);
        ctx.strokeStyle = z.credit === 'partial' ? '#F5A857' : '#7ECEC4';
        ctx.lineWidth = 2; ctx.stroke();
      });
      document.getElementById('clZoneList').textContent = `${zones.length} zone(s) placed.`;
    }
    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      zones.push({ x: (e.clientX - rect.left) / rect.width, y: (e.clientY - rect.top) / rect.height, radius: 0.06, credit: placingCredit });
      redrawZoneCanvas();
    });
    redrawZoneCanvas();
  }

  async function loadDetail() {
    const d = active();
    if (!d) { paint(); return; }
    const { drill, answerKey } = await adminGetDrillDetail(d.id);
    Object.assign(d, drill);
    activeAnswerKey = answerKey;
    paint();
  }

  function wireDetail(d) {
    document.getElementById('fSaveDetails').addEventListener('click', async () => {
      try {
        await adminUpdateDrill(d.id, {
          title: document.getElementById('fTitle').value,
          description: document.getElementById('fDescription').value,
          drillType: document.getElementById('fDrillType').value,
          skillCategory: document.getElementById('fSkillCategory').value,
          difficulty: document.getElementById('fDifficulty').value,
          instrument: document.getElementById('fInstrument').value,
          question: document.getElementById('fQuestion').value,
          lessonKey: document.getElementById('fLessonKey').value || null,
        });
        await refreshList();
      } catch (err) { alert("Couldn't save — " + err.message); }
    });
    document.getElementById('fDuplicate').addEventListener('click', async () => {
      try { await adminDuplicateDrill(d.id); await refreshList(); } catch (err) { alert("Couldn't duplicate — " + err.message); }
    });
    document.getElementById('fPublish')?.addEventListener('click', async () => {
      try { await adminSetDrillStatus(d.id, 'publish_drill'); await refreshList(); } catch (err) { alert("Couldn't publish — " + err.message); }
    });
    document.getElementById('fUnpublish')?.addEventListener('click', async () => {
      try { await adminSetDrillStatus(d.id, 'unpublish_drill'); await refreshList(); } catch (err) { alert("Couldn't unpublish — " + err.message); }
    });
    document.getElementById('fArchive')?.addEventListener('click', async () => {
      if (!confirm(`Archive "${d.title}"? It will no longer be shown to members.`)) return;
      try { await adminSetDrillStatus(d.id, 'archive_drill'); await refreshList(); } catch (err) { alert("Couldn't archive — " + err.message); }
    });

    document.getElementById('fChartFile').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      try {
        const { path } = await adminUploadChartImage(file, d.id);
        await adminUpdateDrill(d.id, { chartImagePath: path });
        alert('Chart image uploaded ✦');
        await loadDetail();
      } catch (err) { alert("Couldn't upload — " + err.message); }
    });

    const answerTypeSelect = document.getElementById('fAnswerType');
    const ak = activeAnswerKey;
    answerTypeSelect.value = ak?.answerType || (d.drillType === 'sequence_builder' ? 'sequence' : d.drillType === 'spot_it' || d.drillType === 'mark_the_chart' ? 'point' : 'choice');
    renderChoiceEditor(answerTypeSelect.value, ak?.choices || [], ak?.correctChoice, ak?.correctSequence);
    renderZoneEditor(d, ak?.zones || []);
    document.getElementById('fExplanation').value = ak?.explanation || '';
    document.getElementById('fCommonMistake').value = ak?.commonMistake || '';
    document.getElementById('fHints').value = (ak?.hints || []).join('\n');
    document.getElementById('fRelatedRule').value = ak?.relatedRule || '';

    answerTypeSelect.addEventListener('change', () => renderChoiceEditor(answerTypeSelect.value, [], '', []));

    document.getElementById('fSaveAnswerKey').addEventListener('click', async () => {
      const answerType = answerTypeSelect.value;
      const choices = answerType !== 'point' ? collectChoices() : [];
      const payload = {
        answerType, choices,
        correctChoice: answerType === 'choice' ? document.getElementById('fCorrectChoice')?.value.trim() : null,
        correctSequence: answerType === 'sequence' ? document.getElementById('fCorrectSequence')?.value.split(',').map((s) => s.trim()).filter(Boolean) : null,
        zones: answerType === 'point' ? zones : [],
        explanation: document.getElementById('fExplanation').value,
        commonMistake: document.getElementById('fCommonMistake').value,
        hints: document.getElementById('fHints').value.split('\n').map((s) => s.trim()).filter(Boolean),
        relatedRule: document.getElementById('fRelatedRule').value,
      };
      try {
        const result = await adminUpsertAnswerKey(d.id, payload);
        document.getElementById('fVersionNote').textContent = result.versioned
          ? `Saved as version ${result.newVersion} (previous version's attempts stay linked to the old answer key).`
          : 'Saved.';
      } catch (err) { alert("Couldn't save the answer key — " + err.message); }
    });
  }

  async function onCreate() {
    const title = prompt('Drill title:'); if (!title) return;
    try {
      const { drill } = await adminCreateDrill({
        title, description: '', drillType: 'valid_invalid', skillCategory: 'market_bias', difficulty: 'foundation',
        question: '', accessTier: 'free', isSeedPlaceholder: false,
      });
      await refreshList();
      activeId = drill.id;
      await loadDetail();
    } catch (err) { alert("Couldn't create the drill — " + err.message); }
  }

  async function refreshList() {
    const { drills: rows } = await adminListDrills();
    drills = rows || [];
    if (!drills.find((d) => d.id === activeId)) activeId = null;
    await loadDetail();
  }

  async function boot() {
    try {
      ({
        adminListDrills, adminGetDrillDetail, adminCreateDrill, adminUpdateDrill, adminUpsertAnswerKey,
        adminUploadChartImage, adminSetDrillStatus, adminDuplicateDrill, adminListReports, adminRespondReport,
        resolveChartImageUrl,
      } = await import('./shared/chartlab-service.js'));
      ({ SKILL_CATEGORIES, DIFFICULTY_LABELS, DRILL_TYPE_LABELS, CHOICES_BY_DRILL_TYPE } = await import('./shared/chartlab-copy.js'));
    } catch (err) { renderFallbackError(err); return; }

    try {
      if (window.AGHF_DEMO) { const { reports: rows } = await adminListReports(); reports = rows || []; await refreshList(); return; }
      const { profile } = await window.AGHF_FETCH_PROFILE();
      if (!profile?.is_admin) { renderNotAuthorized(); return; }
      const { reports: rows } = await adminListReports();
      reports = rows || [];
      await refreshList();
    } catch (err) {
      console.error('Chart Lab Builder profile check error:', err);
      renderFallbackError(err);
    }
  }

  document.addEventListener('aghf-auth-ready', boot);
</script>

</body>
</html>
