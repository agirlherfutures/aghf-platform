<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lessons — A Girl & Her Futures</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/tokens.css">
<link rel="stylesheet" href="shared/sidebar.css">
<link rel="stylesheet" href="shared/structure-charts.css">
<link rel="stylesheet" href="shared/academy-v3.css">
</head>
<body>

<script src="shared/auth-guard.js"></script>
<script src="shared/sidebar.js" data-active="lessons"></script>

<main class="main">
  <div class="pg-eye">✦ Your curriculum</div>
  <div class="pg-title" style="margin-bottom:6px;">Learn it. <span class="pg-acc">Really.</span></div>
  <p style="font-size:.91rem;color:var(--muted);margin-bottom:24px;">8 phases. 22 sections. You can't skip. The quiz doesn't budge. That's how we build real traders.</p>

  <div class="po-g">
    <div class="po-c"><div class="po-l">Lessons done</div><div class="po-v pov-p" id="poLessonsDone">0</div><div class="po-s" id="poLessonsTotal">of 16 total</div></div>
    <div class="po-c"><div class="po-l">Current phase</div><div class="po-v pov-t" id="poPhase">1</div><div class="po-s" id="poPhaseName">Foundation</div></div>
    <div class="po-c"><div class="po-l">GP from lessons</div><div class="po-v pov-c" id="poGp">0</div><div class="po-s">points earned</div></div>
    <div class="po-c"><div class="po-l">Next gate</div><div class="po-v pov-d">Ph1</div><div class="po-s">Quiz after Section 3</div></div>
  </div>

  <div id="phaseList"></div>
</main>

<script type="module">
  // PHASES/isSectionCleared are assigned inside load() via a dynamic
  // import, not a static top-level import — a failed static import here
  // would silently kill this entire script before any of it (including
  // this file's own error-handling code) ever ran, exactly the bug
  // already fixed on this page's sibling pages this session.
  let PHASES, isSectionCleared, icon, UNLOCK = false, V3 = null;

  const BADGE_PHASE_CLASS = { p: 'pb-p', t: 'pb-t', u: 'pb-u', d: 'pb-d' };
  const BADGE_SECTION_CLASS = { p: 'sb-badge-p', t: 'sb-badge-t', c: 'sb-badge-c', u: 'sb-badge-u' };

  function lessonRowHtml(phase, section, lesson, state) {
    const numClass = state === 'done' ? 'n-dn' : state === 'active' ? 'n-act' : 'n-lk';
    const numContent = state === 'done' ? '✓' : lesson.n || '•';
    const rowClass = state === 'locked' ? 'lc lc-lk' : 'lc';
    const statusHtml = state === 'done' ? '<div class="lc-st st-dn">Complete ✓</div>'
      : state === 'active' ? '<div class="lc-st st-go">Start →</div>'
      : '<div class="lc-st st-lk">🔒</div>';
    const inner = `
      <div class="lc-n ${numClass}">${numContent}</div>
      <div class="lc-inf">
        <div class="lc-ttl">${lesson.n ? `Lesson ${lesson.n} ` : ''}${lesson.title}</div>
        <div class="lc-qt">${lesson.quote || ''}</div>
        <div class="lc-tags"><span class="t-ls">Lesson</span><span class="t-xp">+${lesson.xp} GP</span></div>
      </div>
      ${statusHtml}`;
    if (state === 'locked') return `<div class="${rowClass}">${inner}</div>`;
    return `<a class="${rowClass}" href="lesson.html?phase=${phase.key}&n=${lesson.n}">${inner}</a>`;
  }

  // A section game. It links once built (game.href) and the section's lessons are done; it never gates progress.
  function gameRowHtml(phase, section, state) {
    const game = section.game;
    let played = false;
    try { played = !!localStorage.getItem(`aghf_game:${phase.key}-${section.key}`); } catch { /* storage blocked */ }
    const st = state === 'locked' ? 'locked' : played ? 'done' : 'active';
    const inner = `
      <div class="lc-n ${st === 'done' ? 'n-dn' : st === 'active' ? 'n-act' : 'n-lk'}">${st === 'done' ? '✓' : '▶'}</div>
      <div class="lc-inf">
        <div class="lc-ttl">${game.title}</div>
        <div class="lc-qt">${game.quote}</div>
        <div class="lc-tags"><span class="t-gm">Game</span>${game.xp ? `<span class="t-xp">+${game.xp} GP</span>` : ''}</div>
      </div>
      ${st === 'done' ? '<div class="lc-st st-dn">Played ✓ · Play again →</div>' : st === 'active' ? '<div class="lc-st st-go">Play →</div>' : `<div class="lc-st st-lk">🔒 ${game.href ? 'Complete lessons first' : 'Coming soon'}</div>`}`;
    return st === 'locked' ? `<div class="lc lc-lk">${inner}</div>` : `<a class="lc" href="${game.href}">${inner}</a>`;
  }

  function checkpointRowHtml(phase, section, state) {
    const cp = section.checkpoint;
    const numClass = state === 'done' ? 'n-dn' : state === 'active' ? 'n-act' : 'n-lk';
    const numContent = state === 'done' ? '✓' : '★';
    const statusHtml = state === 'done' ? '<div class="lc-st st-dn">Complete ✓</div>'
      : state === 'active' ? '<div class="lc-st st-go">Start →</div>'
      : '<div class="lc-st st-lk">🔒 Complete all lessons first</div>';
    const inner = `
      <div class="lc-n ${numClass}">${numContent}</div>
      <div class="lc-inf">
        <div class="lc-ttl">Section Checkpoint: ${cp.title}</div>
        <div class="lc-qt">${cp.desc || 'Challenge + Knowledge Check + Check-In — clear this to unlock the next section.'}</div>
        <div class="lc-tags"><span class="t-gm">Checkpoint</span>${cp.xp ? `<span class="t-xp">+${cp.xp}+ GP</span>` : ''}</div>
      </div>
      ${statusHtml}`;
    if (state === 'locked') return `<div class="lc lc-lk">${inner}</div>`;
    return `<a class="lc" href="section.html?phase=${phase.key}&section=${section.key}&step=${cp.firstStep || 'welcome'}">${inner}</a>`;
  }

  function sectionHtml(phase, section, completedIds, phaseUnlocked, sectionIdx) {
    const prevSection = phase.sections[sectionIdx - 1];
    const sectionGateOk = !prevSection || !prevSection.checkpoint || isSectionCleared(phase.key, prevSection.key, completedIds);
    const lessonsHtml = section.lessons.map((lesson) => {
      if (!lesson.n) return lessonRowHtml(phase, section, lesson, 'locked');
      const id = `${phase.key}-${lesson.n}`;
      if (UNLOCK) return lessonRowHtml(phase, section, lesson, completedIds.has(id) ? 'done' : 'active');
      if (!phaseUnlocked || !sectionGateOk) return lessonRowHtml(phase, section, lesson, 'locked');
      if (completedIds.has(id)) return lessonRowHtml(phase, section, lesson, 'done');
      const firstIncomplete = !phase.sections.some((s) =>
        s.lessons.some((l) => l.n < lesson.n && l.n && !completedIds.has(`${phase.key}-${l.n}`)));
      return lessonRowHtml(phase, section, lesson, firstIncomplete ? 'active' : 'locked');
    }).join('');
    let checkpointHtml = '';
    if (section.checkpoint) {
      const allLessonsDone = phaseUnlocked && sectionGateOk && section.lessons.every((l) => !l.n || completedIds.has(`${phase.key}-${l.n}`));
      const cleared = phaseUnlocked && isSectionCleared(phase.key, section.key, completedIds);
      checkpointHtml = checkpointRowHtml(phase, section, cleared ? 'done' : (allLessonsDone || (UNLOCK && section.lessons.some((l) => l.n))) ? 'active' : 'locked');
    }
    const gameOpen = !!section.game?.href && (UNLOCK || (phaseUnlocked && sectionGateOk && section.lessons.every((l) => !l.n || completedIds.has(`${phase.key}-${l.n}`))));
    const gameHtml = section.game ? gameRowHtml(phase, section, gameOpen ? 'active' : 'locked') : '';
    const badgeClass = BADGE_SECTION_CLASS[section.badge] || 'sb-badge-p';
    const closed = sectionIdx > 0 ? ' sec-closed' : '';
    const chev = sectionIdx > 0 ? '▼' : '▲';
    const dayliNoteHtml = section.dayliNote ? `<div class="sec-dayli-note">🎀 <strong>Dayli Note:</strong> ${section.dayliNote}</div>` : '';
    return `<div class="sec-blk">
      <div class="sec-hdr${phaseUnlocked ? '' : ' sec-hdr-lk'}" data-toggle-sec="${phase.key}-${section.key}">
        <span class="sec-badge ${badgeClass}">Section ${section.n}</span>
        <div class="sec-title">${section.title}</div>
        <span class="sec-cnt">${section.lessons.length} lesson${section.lessons.length === 1 ? '' : 's'}${phaseUnlocked ? '' : ' 🔒'}${phaseUnlocked && !section.lessons.some((l) => l.n) ? ' · Coming soon' : ''}</span>
        ${phaseUnlocked ? `<span class="sec-chev" id="chev-${phase.key}-${section.key}">${chev}</span>` : ''}
      </div>
      <div class="sec-body${closed}" id="body-${phase.key}-${section.key}">
        ${phaseUnlocked && section.welcome ? welcomeHtml(phase, section, completedIds) : ''}${dayliNoteHtml}${lessonsHtml}${checkpointHtml}${gameHtml}
      </div>
    </div>`;
  }

  // A phase is complete when every built lesson in it is done (saved to the
  // member's account, so it holds on any device). The next phase unlocks on
  // that; section checkpoints gate the sections inside a phase.
  function phaseComplete(phase, completedIds) {
    const lessonsDone = phase.sections.every((s) => s.lessons.every((l) => !l.n || completedIds.has(`${phase.key}-${l.n}`)));
    // A phase with a final gate (e.g. the Phase 2 Final) also needs that gate cleared.
    return lessonsDone && (!phase.finalGate || isSectionCleared(phase.key, phase.finalGate, completedIds));
  }

  // A section's welcome, shown at the top of the section before its lessons.
  function welcomeHtml(phase, section, completedIds) {
    const w = section.welcome;
    const built = section.lessons.filter((l) => l.n);
    const done = built.filter((l) => completedIds.has(`${phase.key}-${l.n}`)).length;
    const progress = `<div class="sec-welcome-progress"><div class="sec-welcome-dots">${built.map((l) => `<i class="${completedIds.has(`${phase.key}-${l.n}`) ? 'on' : ''}"></i>`).join('')}</div>${done} of ${built.length} lessons complete</div>`;
    const goals = w.goals ? `<details><summary class="sec-welcome-eyebrow" style="cursor:pointer;margin-top:8px">🎯 By the end of this section</summary><ul class="sec-welcome-goals">${w.goals.map((g) => `<li>${g}</li>`).join('')}</ul></details>` : '';
    // The visual intro: heading + one-line hook on the left, what you'll learn as icon tiles on the right.
    if (w.learn && icon) {
      return `<div class="sec-welcome sec-vis">
        <div class="sec-vis-top">
          <div class="sec-vis-l">
            <div class="sec-welcome-eyebrow">${w.eyebrow}</div>
            <h3>${w.heading}</h3>
            ${w.hook ? `<p class="sec-vis-hook">${w.hook}</p>` : ''}
            <div class="sec-welcome-mission"><span>🎀 Your mission</span>${w.mission}</div>
          </div>
          <div class="sec-vis-r">
            <div class="sec-vis-label">What you’ll learn</div>
            <div class="sec-vis-tiles">${w.learn.map((t) => `<div class="sec-vis-tile">${icon(t.icon, t.tone || 'pink', 20)}<span>${t.label}</span></div>`).join('')}</div>
          </div>
        </div>
        ${progress}${goals}
      </div>`;
    }
    return `<div class="sec-welcome">
      <div class="sec-welcome-eyebrow">${w.eyebrow}</div>
      <h3>${w.heading}</h3>
      ${w.paragraphs.map((p) => `<p class="${p.cls || ''}">${p.text}</p>`).join('')}
      ${goals}
      <div class="sec-welcome-mission"><span>🎀 Your mission</span>${w.mission}</div>
      ${progress}
    </div>`;
  }

  function phaseHtml(phase, phaseIdx, completedIds) {
    const totalLessons = phase.sections.reduce((sum, s) => sum + s.lessons.length, 0);
    const prevPhase = PHASES[phaseIdx - 1];
    const phaseUnlocked = (UNLOCK && phase.sections.some((sec) => sec.lessons.some((l) => l.n))) || (!phase.locked && (!prevPhase || phaseComplete(prevPhase, completedIds)));
    const doneInPhase = !phaseUnlocked ? 0 : phase.sections.reduce((sum, s) =>
      sum + s.lessons.filter((l) => l.n && completedIds.has(`${phase.key}-${l.n}`)).length, 0);
    const badgeClass = BADGE_PHASE_CLASS[phase.badge] || 'pb-p';
    const sub = phaseUnlocked && phase.comingSoon
      ? '🔓 Unlocked · Lessons coming soon'
      : phaseUnlocked
      ? `Sections ${phase.sections[0].n}–${phase.sections[phase.sections.length - 1].n} · ${doneInPhase === totalLessons ? 'Complete' : 'In progress'}`
      : `🔒 Complete Phase ${phase.n - 1} to unlock${phase.comingSoon ? ' · Coming soon' : ''}`;
    const sectionsHtml = phase.sections.map((s, i) => sectionHtml(phase, s, completedIds, phaseUnlocked, i)).join('');
    const introHtml = phase.sections[0] && phase.sections[0].intro
      ? `<div class="phase-intro-note">✦ <strong>Before you start:</strong> ${phase.sections[0].intro}</div>` : '';
    const gateText = phase.comingSoon
      ? `✦ <strong>Phase ${phase.n} lessons are being built.</strong> Complete the phases before it and they'll be waiting for you when they drop.`
      : phaseUnlocked
        ? `🎯 <strong>Phase ${phase.n} Gate:</strong> Complete all sections + 80% quiz to unlock Phase ${phase.n + 1}.`
        : '';
    const bodyClosed = phaseIdx > 0 ? ' phase-closed' : '';
    const chev = phaseIdx > 0 ? '▼' : '▲';
    return `<div class="phase-blk">
      <div class="phase-hdr" data-toggle-phase="${phase.key}">
        <div class="phase-hdr-left"><span class="phase-badge ${badgeClass}">Phase ${phase.n}</span><div><div class="phase-title">${phase.title}</div><div class="phase-sub">${sub}</div></div></div>
        <div class="phase-hdr-right"><span class="phase-count">${totalLessons} lessons</span><span class="phase-chevron" id="chev-phase-${phase.key}">${chev}</span></div>
      </div>
      <div class="phase-body${bodyClosed}" id="body-phase-${phase.key}">
        ${introHtml}
        ${sectionsHtml}
        ${gateText ? `<div class="gate">${gateText}</div>` : ''}
      </div>
    </div>`;
  }

  /* ── The Academy as cards ───────────────────────────────────────────────
   * The Academy as a grid of phase cards, each with a small graphic. The
   * phase you're on is highlighted. Clicking a card opens that phase's
   * intro and lesson list (the same view as the list layout).
   */
  const ART_TONE = { p: ['#F4829A', '#FCE1E8'], t: ['#5BB5AA', '#E3F4F1'], u: ['#7F77DD', '#ECE9FB'], d: ['#C26A2E', '#FFE6D3'] };
  function phaseArt(key, tone) {
    const [c, bg] = ART_TONE[tone] || ART_TONE.p;
    const cand = (x, o, cl, h, l, up) => `<line x1="${x}" x2="${x}" y1="${h}" y2="${l}" stroke="${up ? '#5BB5AA' : '#E0607C'}" stroke-width="2"/><rect x="${x - 5}" y="${Math.min(o, cl)}" width="10" height="${Math.max(3, Math.abs(o - cl))}" rx="2" fill="${up ? '#7ECEC4' : '#F4829A'}"/>`;
    const svg = (inner) => `<svg viewBox="0 0 200 110" class="pc-art" aria-hidden="true"><rect width="200" height="110" rx="16" fill="${bg}"/>${inner}</svg>`;
    const A = {
      p1: svg(cand(50, 78, 64, 58, 84, 1) + cand(78, 66, 72, 60, 80, 0) + cand(106, 70, 50, 44, 74, 1) + cand(134, 52, 40, 32, 58, 1) + cand(162, 42, 48, 36, 54, 0)),
      p2: svg(`<polyline points="20,88 55,52 75,70 110,34 130,52 170,18" fill="none" stroke="${c}" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>${[[55, 52, 'HH'], [75, 70, 'HL'], [110, 34, 'HH'], [130, 52, 'HL']].map(([x, y, t]) => `<circle cx="${x}" cy="${y}" r="5" fill="#fff" stroke="${c}" stroke-width="2.5"/><text x="${x}" y="${t === 'HH' ? y - 10 : y + 18}" text-anchor="middle" font-size="10" font-weight="800" fill="${c}" font-family="DM Sans">${t}</text>`).join('')}`),
      p3: svg(`<line x1="20" x2="180" y1="30" y2="30" stroke="${c}" stroke-width="2" stroke-dasharray="6 5"/><polyline points="20,90 50,32 75,70 105,31 130,75 160,28 180,60" fill="none" stroke="#2C1810" stroke-width="3" stroke-linejoin="round"/><text x="100" y="20" text-anchor="middle" font-size="10" font-weight="800" fill="${c}" font-family="DM Sans">EQUAL HIGHS</text>`),
      p4: svg(`<rect x="30" y="22" width="140" height="66" rx="10" fill="#fff" stroke="${c}" stroke-width="2" stroke-dasharray="6 5"/><line x1="30" x2="170" y1="55" y2="55" stroke="${c}" stroke-width="1.5" opacity=".5"/><path d="M60 80 L100 40 L140 66" fill="none" stroke="#2C1810" stroke-width="3" stroke-linecap="round"/><path d="M100 26 l10 14 h-20 z" fill="${c}"/>`),
      p5: svg(`<line x1="15" x2="185" y1="56" y2="56" stroke="#C9962E" stroke-width="2.5" stroke-dasharray="7 5"/><text x="182" y="50" text-anchor="end" font-size="10" font-weight="800" fill="#C9962E" font-family="DM Sans">PIL</text>` + cand(40, 80, 70, 66, 86, 1) + cand(66, 70, 44, 40, 74, 1) + cand(92, 46, 66, 42, 70, 0) + cand(118, 66, 42, 38, 70, 1) + cand(144, 44, 30, 24, 50, 1) + `${[[66, 'I'], [92, 'C'], [118, 'C']].map(([x, t]) => `<circle cx="${x}" cy="98" r="9" fill="${c}"/><text x="${x}" y="102" text-anchor="middle" font-size="11" font-weight="900" fill="#fff" font-family="DM Sans">${t}</text>`).join('')}`),
      s2: svg(`<rect x="70" y="58" width="115" height="16" rx="4" fill="rgba(126,206,196,.35)" stroke="#4FA99E" stroke-width="2"/><polyline points="15,90 45,62 60,74 90,40 110,64 140,22 160,60 175,44" fill="none" stroke="#2C1810" stroke-width="3" stroke-linejoin="round"/><text x="128" y="70" text-anchor="middle" font-size="9" font-weight="900" fill="#1F8A7E" font-family="DM Sans">ZONE</text>${[[45, 62], [90, 40], [140, 22]].map(([x, y], i) => `<text x="${x}" y="${y - 7}" text-anchor="middle" font-size="9" font-weight="900" fill="${c}" font-family="DM Sans">BOS${i + 1}</text>`).join('')}`),
      p6: svg(`<line x1="20" x2="180" y1="28" y2="28" stroke="#5BB5AA" stroke-width="2.5"/><line x1="20" x2="180" y1="62" y2="62" stroke="#C9962E" stroke-width="2.5" stroke-dasharray="6 4"/><line x1="20" x2="180" y1="84" y2="84" stroke="#E0607C" stroke-width="2.5"/>${[['TARGET', 28, '#5BB5AA'], ['ENTRY', 62, '#C9962E'], ['STOP', 84, '#E0607C']].map(([t, y, col]) => `<text x="24" y="${y - 5}" font-size="9" font-weight="900" fill="${col}" font-family="DM Sans">${t}</text>`).join('')}<circle cx="130" cy="62" r="13" fill="none" stroke="#2C1810" stroke-width="2.5"/><line x1="130" x2="130" y1="44" y2="80" stroke="#2C1810" stroke-width="2"/><line x1="112" x2="148" y1="62" y2="62" stroke="#2C1810" stroke-width="2"/>`),
      p7: svg(`<path d="M100 88 C60 62 52 40 66 30 C78 22 92 28 100 40 C108 28 122 22 134 30 C148 40 140 62 100 88 Z" fill="${c}" opacity=".9"/><path d="M30 60 q12 -12 24 0 t24 0" fill="none" stroke="#fff" stroke-width="0"/><path d="M68 56 h14 l6 -10 l8 20 l6 -10 h20" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`),
      p8: svg(`<path d="M100 22 L160 44 L100 66 L40 44 Z" fill="#2C1810"/><path d="M68 54 V74 C68 84 132 84 132 74 V54 L100 66 Z" fill="#2C1810" opacity=".85"/><line x1="160" x2="160" y1="44" y2="74" stroke="${c}" stroke-width="2.5"/><circle cx="160" cy="78" r="5" fill="${c}"/><text x="100" y="100" text-anchor="middle" font-size="10" font-weight="900" fill="${c}" font-family="DM Sans" letter-spacing="1.5">GRADUATE</text>`),
    };
    return A[key] || svg('');
  }
  const PHASE_LINE = {
    p1: 'Learn the language of trading, before the chart.',
    p2: 'Read how markets move: swings, breaks and key levels.',
    p3: 'Liquidity, imbalances and who’s really moving price.',
    p4: 'Find your bias and where price sits in the range.',
    p5: 'Your first strategy, from the 4H story to the 1M entry.',
    s2: '3 Breaks. 2 Corrections. 1 Zone. 1 Retest.',
    p6: 'Enter, manage and protect the trade.',
    p7: 'The mindset that keeps the model working.',
    p8: 'Put it all together and prove it.',
  };

  function cardHtml({ key, badge, tone, title, line, done, total, state, extra }) {
    const pct = total ? Math.round((done / total) * 100) : 0;
    const chip = state === 'current' ? '<span class="pc-chip pc-here">You’re here</span>'
      : state === 'done' ? '<span class="pc-chip pc-done">Complete ✓</span>'
        : state === 'locked' ? '<span class="pc-chip pc-lock">🔒 Locked</span>' : '';
    return `<button type="button" class="pc pc-${tone}${state === 'current' ? ' is-current' : ''}${state === 'locked' ? ' is-locked' : ''}" data-open="${key}">
      ${phaseArt(key, tone)}
      <div class="pc-body">
        <div class="pc-top"><span class="pc-badge">${badge}</span>${chip}</div>
        <div class="pc-title">${title}</div>
        <div class="pc-line">${line}</div>
        ${extra || ''}
        <div class="pc-prog"><div class="pc-bar"><i style="width:${pct}%"></i></div><span>${done}/${total} lessons</span></div>
      </div>
    </button>`;
  }

  async function strategyTwoDetail(open) {
    const { STRATEGY_LAB } = await import('./shared/strategy-lab-data.js');
    const { lessonDone, toolDone } = await import('./shared/sd-progress.js');
    const row = (href, n, title, done, tag) => `<${open ? `a class="lc" href="${href}"` : 'div class="lc lc-lk"'}>
        <div class="lc-n ${done ? 'n-dn' : open ? 'n-act' : 'n-lk'}">${done ? '✓' : n}</div>
        <div class="lc-inf"><div class="lc-ttl">${tag === 'Game' ? '' : `Lesson ${n} `}${title}</div><div class="lc-tags"><span class="${tag === 'Game' ? 't-gm' : 't-ls'}">${tag}</span></div></div>
        <div class="lc-st ${done ? 'st-dn' : open ? 'st-go' : 'st-lk'}">${done ? 'Complete ✓' : open ? 'Start →' : '🔒'}</div></${open ? 'a' : 'div'}>`;
    const mods = STRATEGY_LAB.modules.map((m) => `<div class="sec-blk"><div class="sec-hdr"><span class="sec-badge sb-badge-u">Module ${m.n}</span><div class="sec-title">${m.title}</div></div>
      <div class="sec-body">${m.lessons.map((l, i) => row(`strategy-lab-lesson.html?id=${l.id}`, i + 1, l.title, lessonDone(l.id), 'Lesson')).join('')}</div></div>`).join('');
    const games = `<div class="sec-blk"><div class="sec-hdr"><span class="sec-badge sb-badge-t">Practice</span><div class="sec-title">Labs</div></div><div class="sec-body">${STRATEGY_LAB.tools.map((t) => row(`strategy-lab-lesson.html?id=${t.id}`, '▶', t.title, toolDone(t.key), 'Game')).join('')}</div></div>`;
    return `<div class="phase-blk"><div class="phase-hdr"><div class="phase-hdr-left"><span class="phase-badge pb-u">Strategy 2 · Optional</span><div><div class="phase-title">Supply &amp; Demand, Powered by Higher-Timeframe ICC™</div><div class="phase-sub">${open ? 'Built on the same higher-timeframe ICC as the Dayli ICC Method · never blocks graduation' : '🔒 Complete Phase 5 to unlock · optional'}</div></div></div></div>
      <div class="phase-body"><div class="phase-intro-note">✦ <strong>A second strategy for your tool belt.</strong> The higher-timeframe ICC tells the story, the 15M sets the direction, and the 5M builds the sequence: 3 Breaks, 2 Corrections, 1 Zone, 1 Retest.</div>${mods}${games}</div></div>`;
  }

  async function renderCards(completedIds, extraHtml, afterHtml = '') {
    const list = document.getElementById('phaseList');
    const { lessonDone } = await import('./shared/sd-progress.js');
    const { allLabLessons } = await import('./shared/strategy-lab-data.js');
    const total = (ph) => ph.sections.reduce((n, s) => n + s.lessons.filter((l) => l.n).length, 0);
    const done = (ph) => ph.sections.reduce((n, s) => n + s.lessons.filter((l) => l.n && completedIds.has(`${ph.key}-${l.n}`)).length, 0);
    const currentIdx = PHASES.findIndex((ph, i) => !phaseComplete(ph, completedIds));
    const unlocked = (i) => UNLOCK || i === 0 || phaseComplete(PHASES[i - 1], completedIds);
    const p5i = PHASES.findIndex((ph) => ph.key === 'p5');
    const sdOpen = UNLOCK || phaseComplete(PHASES[p5i], completedIds);
    const sdLessons = allLabLessons();
    const cards = [];
    PHASES.forEach((ph, i) => {
      cards.push(cardHtml({ key: ph.key, tone: ph.badge, badge: ph.key === 'p5' ? `Phase ${ph.n} · Strategy 1` : `Phase ${ph.n}`, title: ph.title.replace(/\s*✦\s*$/, ''), line: PHASE_LINE[ph.key] || '',
        done: done(ph), total: total(ph), state: i === currentIdx ? 'current' : phaseComplete(ph, completedIds) ? 'done' : unlocked(i) ? 'open' : 'locked' }));
      if (i === p5i) cards.push(cardHtml({ key: 's2', tone: 'u', badge: 'Strategy 2 · Optional', title: 'Supply &amp; Demand', line: PHASE_LINE.s2,
        done: sdLessons.filter((l) => lessonDone(l.id)).length, total: sdLessons.length, state: sdOpen ? 'open' : 'locked',
        extra: '<div class="pc-subtitle">Powered by Higher-Timeframe ICC™</div>' }));
    });
    const grid = `${extraHtml}<div class="pc-grid">${cards.join('')}</div>${afterHtml}`;
    const showGrid = () => { document.body.classList.remove('aca-v3', 'aca-p1', 'aca-p2'); list.innerHTML = grid; wireCards(); };
    async function openCard(key) {
      const back = '<button type="button" class="pc-back">← All phases</button>';
      if (key === 's2') list.innerHTML = back + await strategyTwoDetail(sdOpen);
      else if (V3 && V3.isV3(key)) {
        const i = PHASES.findIndex((ph) => ph.key === key);
        const phase = PHASES[i];
        const prevPhase = PHASES[i - 1];
        const phaseUnlocked = UNLOCK || (!phase.locked && (!prevPhase || phaseComplete(prevPhase, completedIds)));
        const wantSec = new URLSearchParams(location.search).get('section');
        let selected = wantSec ? Math.max(0, phase.sections.findIndex((x) => x.key === wantSec)) : null;
        const paint = () => {
          list.innerHTML = back + `<div class="v3-phase-head"><span class="v3-eyebrow">✦ Phase ${phase.n}</span><h2>${V3.accent(phase.title.replace(/\s*✦\s*$/, ''))}</h2></div>`
            + V3.phaseHomeHtml({ phase, completedIds, UNLOCK, isSectionCleared, phaseUnlocked, selected });
          V3.wirePhaseHome(list, (idx) => { selected = idx; paint(); });
          list.querySelector('.pc-back').addEventListener('click', () => { showGrid(); window.scrollTo({ top: list.offsetTop - 20, behavior: 'smooth' }); });
        };
        document.body.classList.add('aca-v3', `aca-${key}`);
        paint();
        window.scrollTo({ top: list.offsetTop - 20, behavior: 'smooth' });
        return;
      }
      else {
        const i = PHASES.findIndex((ph) => ph.key === key);
        list.innerHTML = back + phaseHtml(PHASES[i], i, completedIds);
        list.querySelector('.phase-body')?.classList.remove('phase-closed'); // opened from its card
        wireToggles();
      }
      list.querySelector('.pc-back').addEventListener('click', () => { showGrid(); window.scrollTo({ top: list.offsetTop - 20, behavior: 'smooth' }); });
      window.scrollTo({ top: list.offsetTop - 20, behavior: 'smooth' });
    }
    function wireCards() { list.querySelectorAll('[data-open]').forEach((b) => b.addEventListener('click', () => openCard(b.dataset.open))); }
    showGrid();
    // lessons.html?open=p5 (or s2) opens that card straight away, e.g. coming back from a lesson.
    const want = new URLSearchParams(location.search).get('open');
    if (want && list.querySelector(`[data-open="${want}"]`)) openCard(want);
  }

  function wireToggles() {
    document.querySelectorAll('[data-toggle-phase]').forEach((hdr) => {
      hdr.addEventListener('click', () => {
        const key = hdr.dataset.togglePhase;
        const body = document.getElementById(`body-phase-${key}`);
        const chev = document.getElementById(`chev-phase-${key}`);
        const closed = body.classList.toggle('phase-closed');
        if (chev) chev.textContent = closed ? '▼' : '▲';
      });
    });
    document.querySelectorAll('[data-toggle-sec]').forEach((hdr) => {
      hdr.addEventListener('click', (e) => {
        e.stopPropagation();
        const key = hdr.dataset.toggleSec;
        const body = document.getElementById(`body-${key}`);
        const chev = document.getElementById(`chev-${key}`);
        if (!body) return;
        const closed = body.classList.toggle('sec-closed');
        if (chev) chev.textContent = closed ? '▼' : '▲';
      });
    });
  }

  function renderLoadError(err) {
    console.error('Lessons page failed to load:', err);
    const container = document.getElementById('phaseList');
    container.innerHTML = `
      <div style="max-width:520px;margin:40px auto;padding:28px;background:#fff;border-radius:16px;border:1px solid var(--border,#F1E7E1);text-align:center;">
        <div style="font-size:1.1rem;font-weight:700;color:var(--text,#3D2B20);margin-bottom:8px;">Something went wrong loading your lessons</div>
        <div style="font-size:.88rem;color:var(--muted,#7A5C50);margin-bottom:18px;word-break:break-word;">${(err && err.message) ? err.message : 'An unexpected error occurred.'}</div>
        <button type="button" onclick="location.reload()" style="padding:10px 22px;border-radius:999px;border:none;background:var(--pink,#F4829A);color:#fff;font-weight:600;cursor:pointer;">Reload</button>
      </div>`;
  }

  async function load() {
    try {
      ({ PHASES, isSectionCleared } = await import('./shared/curriculum-data.js'));
      ({ UNLOCK_ALL: UNLOCK } = await import('./shared/preview.js'));
      ({ icon } = await import('./shared/icons.js'));
      try { V3 = await import('./shared/academy-v3.js'); } catch (err) { console.error('Academy look failed to load:', err); }
    } catch (err) {
      renderLoadError(err);
      return;
    }

    let completedIds = new Set();
    let gpFromLessons = 0;
    try {
      const data = await window.AGHF_FETCH_PROFILE();
      completedIds = new Set((data.lessons_completed || []).map((l) => l.lesson_id));
      gpFromLessons = (data.lessons_completed || []).reduce((sum, l) => sum + (l.gp_earned || 0), 0);
    } catch (err) {
      console.error('Profile load error:', err);
    }

    try {
      const p1 = PHASES[0];
      const p1Total = p1.sections.reduce((sum, s) => sum + s.lessons.length, 0);
      const p1Done = p1.sections.reduce((sum, s) => sum + s.lessons.filter((l) => l.n && completedIds.has(`p1-${l.n}`)).length, 0);
      const totalAll = PHASES.reduce((sum, p) => sum + p.sections.reduce((s, sec) => s + sec.lessons.length, 0), 0);

      document.getElementById('poLessonsDone').textContent = p1Done;
      document.getElementById('poLessonsTotal').textContent = `of ${totalAll} total`;
      document.getElementById('poPhase').textContent = '1';
      document.getElementById('poPhaseName').textContent = p1Done === p1Total ? 'Complete' : 'Foundation';
      document.getElementById('poGp').textContent = gpFromLessons;

      const unlockNote = UNLOCK ? '<div class="gate" style="margin-bottom:14px">👀 <strong>Build mode:</strong> every built lesson and checkpoint is unlocked so you can jump around. The normal gates come back before launch.</div>' : '';
      const ls = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
      const grad = !!ls('aghf_alumni');
      const capReady = grad || ls('aghf_section_clear:p8-s22') === 'true' || UNLOCK;
      const capCard = capReady ? `<a href="${grad ? 'certificate.html' : 'capstone.html'}" style="display:block;text-decoration:none;margin-top:14px;background:linear-gradient(135deg,#1C1929,#2A2240);color:#fff;border-radius:18px;padding:18px 22px;"><div style="font-size:.7rem;letter-spacing:.16em;color:#F7A8C8;font-weight:700">${grad ? 'ALUMNI ✦' : 'OUTSIDE THE 8 PHASES'}</div><div style="font-family:var(--font-display);font-size:1.25rem;margin:4px 0">🎓 You’re In Structure Capstone</div><div style="font-size:.86rem;color:#CFC8E3">${grad ? 'Passed. View your certificate →' : 'One full trading day, scored on process. Begin →'}</div></a>` : '';
      await renderCards(completedIds, unlockNote, capCard);
    } catch (err) {
      renderLoadError(err);
    }
  }

  document.addEventListener('aghf-auth-ready', async () => {
    try { await load(); } finally { window.AGHF_HIDE_LOADER?.(); }
  });
</script>

</body>
</html>
